openapi: "3.1.0"
info:
  title: Valuz Agent API
  version: "0.3.0"
  description: Valuz Agent API contract — single source of truth

servers:
  - url: http://localhost:8000
    description: Local development

paths:
  /v1/runs:
    get:
      summary: List runs for the activity overview (running sessions / tasks)
      operationId: listRuns
      tags: [runs]
      parameters:
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [running, finished]
            default: running
          description: running = in-flight; finished = recently completed/failed runs
      responses:
        "200":
          description: Runs
          content:
            application/json:
              schema:
                type: object
                required: [runs]
                properties:
                  runs:
                    type: array
                    items:
                      $ref: "#/components/schemas/RunSummary"
  /v1/activity:
    get:
      summary: Unified activity feed (chats + tasks), cursor-paginated
      operationId: listActivity
      tags: [activity]
      parameters:
        - name: project_id
          in: query
          required: false
          schema: {type: string}
          description: Scope to one project; omit for the global 动态 feed.
        - name: tab
          in: query
          required: false
          schema: {type: string, enum: [all, chat, task, automation], default: all}
        - name: limit
          in: query
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 20}
        - name: cursor
          in: query
          required: false
          schema: {type: string}
          description: Opaque keyset cursor from a prior page's next_cursor.
      responses:
        "200":
          description: A page of activity items (newest first)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ActivityPage"
  /v1/agents:
    get:
      summary: List official Agents (read-only)
      operationId: listAgents
      tags: [agents]
      parameters:
        - name: source
          in: query
          required: false
          schema:
            type: string
          description: Filter by source (official|custom).
      responses:
        "200":
          description: Official agents
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/Agent"
    post:
      summary: Create a user-defined Agent
      operationId: createAgent
      tags: [agents]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAgentRequest"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "409":
          description: Slug already exists
  /v1/agents/{slug}:
    get:
      summary: Get a single Agent
      operationId: getAgent
      tags: [agents]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Agent not found
    patch:
      summary: Update an Agent
      operationId: updateAgent
      tags: [agents]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAgentRequest"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
        "404":
          description: Agent not found
    delete:
      summary: Delete an Agent
      operationId: deleteAgent
      tags: [agents]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: cascade
          in: query
          required: false
          description: >-
            When true, first 解除 every 派驻 (project membership) the agent has,
            then delete it — the confirmed-delete path. When false (default), an
            agent still deployed to a project returns 409.
          schema:
            type: boolean
            default: false
      responses:
        "204":
          description: Deleted
        "404":
          description: Agent not found
        "409":
          description: Agent still deployed to one or more projects (解除派驻 first; pass cascade=true to force)
  /v1/agents/{slug}/deployments:
    get:
      summary: List the projects an agent is deployed (派驻) into
      operationId: listAgentDeployments
      tags: [agents]
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deployments (live-reference 派驻 across projects)
          content:
            application/json:
              schema:
                type: object
                required: [deployments, count]
                properties:
                  count: {type: integer}
                  deployments:
                    type: array
                    items:
                      type: object
                      required: [project_id, agent_slug]
                      properties:
                        project_id: {type: string}
                        agent_slug:
                          type: string
                          description: Project-local member handle.
        "404":
          description: Agent not found
  /v1/projects/{project_id}/agents:
    get:
      summary: List project member agents
      operationId: listProjectAgents
      tags: [agents]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Project member agents
          content:
            application/json:
              schema:
                type: object
                required: [agents]
                properties:
                  agents:
                    type: array
                    items:
                      $ref: "#/components/schemas/MemberWithAgent"
    post:
      summary: Create a blank (template-free) agent in a project
      operationId: createBlankAgent
      tags: [agents]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateBlankAgentRequest"
      responses:
        "201":
          description: Created member agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberWithAgent"
        "409":
          description: Agent slug already exists in project
  /v1/projects/{project_id}/agents:deploy:
    post:
      summary: Deploy (派驻, live-reference) a library agent into a project
      operationId: deployAgent
      tags: [agents]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeployAgentRequest"
      responses:
        "201":
          description: Created member agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemberWithAgent"
        "404":
          description: Source agent not found
        "409":
          description: Agent slug already exists in project
  /v1/projects/{project_id}/agents/{agent_slug}:
    delete:
      summary: Delete a project agent and its kernel AgentConfig
      operationId: deleteProjectAgent
      tags: [agents]
      parameters:
        - name: project_id
          in: path
          required: true
          schema:
            type: string
        - name: agent_slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Deleted
        "404":
          description: Agent not found
  /v1/agents/proposals/{session_id}/confirm:
    post:
      summary: Confirm a proposed agent (create in the library + deploy into the session's project)
      description: >-
        User confirmation of an agent the assistant proposed via the
        ``propose_agent`` tool. Creates a library agent and, when the session is
        bound to a project, deploys it into that project as a member. The frontend
        replays the agent spec from the originating ``tool_use`` event into the
        request body.
      operationId: confirmAgentProposal
      tags: [agents]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProposeAgentConfirmRequest"
      responses:
        "201":
          description: Agent created (and deployed when the session has a project)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProposeAgentConfirmResponse"
        "404":
          description: Session not found
        "409":
          description: Agent already exists
  /v1/projects/{project_id}/tasks:
    post:
      summary: Kickoff a lead-dispatch task
      operationId: kickoffTask
      tags: [tasks]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KickoffTaskRequest"
      responses:
        "201":
          description: Created task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "400":
          description: Project or lead agent not found
    get:
      summary: List project tasks
      operationId: listTasks
      tags: [tasks]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
  /v1/projects/{project_id}/worktrees:
    get:
      summary: List the project's git worktrees (git is the source of truth)
      operationId: listProjectWorktrees
      tags: [projects]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: |
            Computed-on-read worktree list plus the project's git facts
            (feature gate for the "run in worktree" toggle). ``worktrees``
            is empty when the project isn't a git repository.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorktreeListResponse"
        "404":
          description: Project not found
  /v1/projects/{project_id}/worktrees/{name}:
    delete:
      summary: Discard a worktree (fail-closed)
      operationId: discardProjectWorktree
      tags: [projects]
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string}
        - name: name
          in: path
          required: true
          schema: {type: string}
        - name: force
          in: query
          required: false
          schema: {type: boolean, default: false}
          description: |
            Required to discard a worktree whose state can't be verified
            clean (uncommitted files, unmerged commits, or a lost
            change-detection anchor). UIs must show the dirty/ahead
            counts from the 409 body (or the list endpoint) in a
            confirm dialog before retrying with ``force=true``.
      responses:
        "204":
          description: Worktree and its branch removed
        "404":
          description: Project or worktree not found
        "409":
          description: Worktree holds unmerged work and ``force`` was not set
  /v1/files/resolve:
    post:
      summary: Resolve file identities to client-accessible addresses
      description: |
        Exchanges `valuz-file://` absolute-path identities for local paths or
        remote presigned URLs. The API returns metadata and capabilities only;
        file bytes are fetched directly by the client.
      operationId: resolveFiles
      tags: [files]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResolveFilesRequest"
      responses:
        "200":
          description: Resolved address descriptors in request order
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolveFilesResponse"
        "422":
          description: Invalid request or more than 256 refs
  /v1/tasks:
    get:
      summary: List tasks across every project
      description: |
        Global, cross-project task list ordered by updated_at desc. Powers the
        sidebar TASKS section so users can see what's running regardless of
        which project page they're on.
      operationId: listAllTasks
      tags: [tasks]
      parameters:
        - name: limit
          in: query
          required: false
          schema: {type: integer, default: 50, minimum: 1, maximum: 200}
      responses:
        "200":
          description: Tasks
          content:
            application/json:
              schema:
                type: object
                required: [tasks]
                properties:
                  tasks:
                    type: array
                    items:
                      $ref: "#/components/schemas/Task"
  /v1/tasks/{task_id}:
    get:
      summary: Task detail (header + runs + events)
      operationId: getTask
      tags: [tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Task detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TaskDetail"
        "404":
          description: Task not found
  /v1/tasks/{task_id}/events:
    get:
      summary: Task event log (ACTIVITY)
      operationId: listTaskEvents
      tags: [tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: object
                required: [events]
                properties:
                  events:
                    type: array
                    items:
                      $ref: "#/components/schemas/TaskEvent"
  /v1/tasks/{task_id}:intervene:
    post:
      summary: User intervention on a task (note/revise_goal/pause/resume/stop)
      description: >-
        For action=resume, the optional `text` field carries a user
        instruction that rides along with the resume — it is recorded as a
        `user_inject` task event and embedded in the respawned lead's
        recovery brief.
      operationId: interveneTask
      tags: [tasks]
      parameters:
        - name: task_id
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InterveneRequest"
      responses:
        "200":
          description: Updated task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Task"
        "404":
          description: Task not found
  /v1/runs/{session_id}:stop:
    post:
      summary: User-initiated single-member stop (interrupt subtask, node→rework)
      operationId: stopMember
      tags: [tasks]
      parameters:
        - name: session_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Member stopped
          content:
            application/json:
              schema:
                type: object
                properties:
                  stopped: {type: boolean}
                required: [stopped]
        "404":
          description: Subtask run not found
  /health:
    get:
      summary: Health check
      operationId: healthCheck
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "ok"

  /api/v1/users:
    get:
      summary: List users
      operationId: listUsers
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            default: 20
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaginatedResponse"

  # ── Runtime Agents (REP-107) ───────────────────────────────────────

  /v1/runtimes:
    get:
      summary: List runtime agents and live availability
      operationId: listRuntimes
      tags: [runtimes]
      description: |
        Drives the Runtime picker on the session-creation form. Each
        entry exposes:

        - ``supported_protocols``: API protocols this runtime can
          dispatch — used to filter the list of compatible providers for
          the model dropdown.
        - ``available`` + ``unavailable_reason``: live host probe.
          ``codex`` reports ``available=false`` when the ``codex``
          binary is missing from PATH (and ``CODEX_BIN_OVERRIDE`` isn't
          set). The frontend should grey out unavailable runtimes and
          render ``unavailable_reason`` as a tooltip.
      responses:
        "200":
          description: Runtime list
          content:
            application/json:
              schema:
                type: object
                required: [runtimes]
                properties:
                  runtimes:
                    type: array
                    items:
                      $ref: "#/components/schemas/RuntimeListItem"

  # ── Memory (inspect / prune / toggle the agent memory system) ────────

  /v1/memory:
    get:
      summary: View stored memory and the memory toggles
      operationId: getMemory
      tags: [memory]
      description: |
        Returns the on/off toggles plus current entries per scope: ``user``
        and cross-project ``global`` always, plus ``project`` when a
        ``project_id`` is supplied. Drives Settings → Memory and the project
        Context Panel memory section.
      parameters:
        - name: project_id
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Memory view
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryView"

  /v1/memory/settings:
    patch:
      summary: Toggle the memory system on/off
      operationId: patchMemorySettings
      tags: [memory]
      description: |
        ``enabled`` is the master switch (injection + background extractor);
        ``auto_extract`` gates only the background extractor. Only sent keys
        are updated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemorySettingsPatch"
      responses:
        "200":
          description: Updated toggles
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemorySettings"

  /v1/memory/entry:
    delete:
      summary: Delete a single memory entry
      operationId: deleteMemoryEntry
      tags: [memory]
      description: |
        Removes the entry located by a unique substring (``old_text``) in the
        given ``target``. Returns 404 when no entry matches.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryEntryDelete"
      responses:
        "200":
          description: Memory view after deletion
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryView"

  /v1/memory/scope:
    delete:
      summary: Clear all entries in a memory scope
      operationId: clearMemoryScope
      tags: [memory]
      description: |
        Removes every entry in ``target`` (``user`` / ``global`` / ``project``).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemoryClear"
      responses:
        "200":
          description: Memory view after clearing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MemoryView"

  # ── System (backend status & log path discovery) ────────────────────

  /v1/system/status:
    get:
      summary: Backend process status & introspection
      operationId: getSystemStatus
      tags: [system]
      description: |
        Snapshot of the running backend process — drives the desktop
        ``服务`` panel (status card on top of the log viewer). Cheap to
        call; safe to poll every few seconds.
      responses:
        "200":
          description: Current backend status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SystemStatusResponse"

  # ── Browser (managed chrome-devtools daemon; Settings panel) ──────────

  /v1/browser/status:
    get:
      summary: Managed-browser status & environment readiness
      operationId: getBrowserStatus
      tags: [browser]
      description: |
        Cheap, read-only snapshot for the Settings "Browser" panel: whether Node
        is present, whether the chrome-devtools daemon is running, the active
        mode, and any user-facing hints. Safe to poll.
      responses:
        "200":
          description: Current managed-browser status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserStatus"

  /v1/browser/open:
    post:
      summary: Start (or reuse) the managed browser
      operationId: openBrowser
      tags: [browser]
      description: |
        Login helper: launches (or reuses) the managed, visible Chrome on the
        isolated profile so the user can sign into sites. Returns the active mode
        and the CLI prefix. 422 when the environment isn't ready (e.g. Node
        missing); the message is shown as a hint.
      responses:
        "200":
          description: Browser started or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserStartResult"

  /v1/browser/stop:
    post:
      summary: Stop the managed browser
      operationId: stopBrowser
      tags: [browser]
      description: |
        Stops the chrome-devtools daemon (best-effort). The isolated profile
        persists, so login state survives; only the window/daemon closes.
      responses:
        "200":
          description: Browser stopped
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BrowserStopResult"

  # ── Parser plugin setup (user-authorized model downloads) ──────────

  /v1/system/parser/setup:
    get:
      summary: List parser setup jobs and their current status
      operationId: listParserSetupJobs
      tags: [parser]
      description: |
        Returns one entry per registered setup_id (e.g. ``rapidocr_models``).
        Drives the "Local Capabilities" section on the parsing settings
        page — each row gets a "Download / Re-download" button.
      responses:
        "200":
          description: Setup job list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupJobListResponse"

  /v1/system/parser/setup/{setup_id}:
    parameters:
      - name: setup_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Current status of a single setup job
      operationId: getParserSetupJob
      tags: [parser]
      description: |
        Polled by the frontend ~every 2 seconds while a download is in
        flight. Cheap to call — pure DB read.
      responses:
        "200":
          description: Setup job status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupJobStatus"
        "404":
          description: Unknown setup_id
    delete:
      summary: Cancel an in-flight setup job
      operationId: cancelParserSetupJob
      tags: [parser]
      description: |
        Sets a cooperative cancellation flag. The worker thread observes
        it on the next chunk-loop iteration and cleans up ``*.partial``
        files; the final status reflects ``cancelled``.
      responses:
        "200":
          description: Updated status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupJobStatus"
        "404":
          description: Unknown setup_id

  /v1/system/parser/setup/{setup_id}/start:
    parameters:
      - name: setup_id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Authorize and start a setup job
      operationId: startParserSetupJob
      tags: [parser]
      description: |
        Hard authorization gate: ``accept_license`` must be ``true`` and
        ``confirmed_source`` must equal the requirement's ``source``
        string. This is the only path that triggers network downloads —
        no silent fetch ever happens.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StartSetupJobRequest"
      responses:
        "200":
          description: Job started (or already complete)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SetupJobStatus"
        "400":
          description: Missing authorization fields
        "404":
          description: Unknown setup_id
        "409":
          description: Setup job already running

  # ── Parser settings (routing + per-plugin config) ──────────────────

  /v1/settings/parser/plugins:
    get:
      summary: List parser plugins shipped with this build
      operationId: listParserPlugins
      tags: [parser]
      description: |
        Each entry combines static descriptor metadata (id, name,
        config_schema, supported_kinds) with the *effective* runtime
        capability status (e.g. RapidOCR's image kind reads
        ``needs_setup`` until the user authorizes the download).
      responses:
        "200":
          description: Plugin list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginsListResponse"

  /v1/settings/parser:
    get:
      summary: Get parser routing configuration
      operationId: getParserRouting
      tags: [parser]
      responses:
        "200":
          description: Routing snapshot incl. server-rendered effective_by_kind
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParserRoutingResponse"
    patch:
      summary: Update parser routing configuration
      operationId: patchParserRouting
      tags: [parser]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ParserRoutingPatchRequest"
      responses:
        "200":
          description: Updated routing snapshot
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ParserRoutingResponse"
        "422":
          description: Invalid plugin id

  /v1/settings/parser/plugins/{plugin_id}/config:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema:
          type: string
    get:
      summary: Get user-supplied configuration for one plugin
      operationId: getPluginConfig
      tags: [parser]
      description: |
        ``has_secret`` indicates whether an API key has been stored;
        plaintext secrets are never returned.
      responses:
        "200":
          description: Plugin config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginConfigResponse"
        "404":
          description: Unknown plugin_id
    patch:
      summary: Update plugin configuration (API key, options)
      operationId: patchPluginConfig
      tags: [parser]
      description: |
        Plaintext ``secret`` is hashed into the FileSecretStore on
        receipt and only the ``secret_ref`` lands in
        ``valuz_app_setting``. Pass an empty string to clear.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PluginConfigPatchRequest"
      responses:
        "200":
          description: Updated plugin config
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginConfigResponse"
        "404":
          description: Unknown plugin_id

  /v1/settings/parser/plugins/{plugin_id}/test:
    parameters:
      - name: plugin_id
        in: path
        required: true
        schema:
          type: string
    post:
      summary: Health-check a plugin with its current configuration
      operationId: testPlugin
      tags: [parser]
      description: |
        Builds the plugin's ``ParserBackend`` from stored config and
        invokes ``health_check``. No file upload required — surfaces
        bad API keys / wrong endpoints without burning a real parse.
      responses:
        "200":
          description: Test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PluginTestResponse"
        "404":
          description: Unknown plugin_id

