name: Release Desktop

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag (e.g. v0.2.0). Leave empty to use package.json version."
        required: false
        type: string
      platform:
        description: "Platform to build"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - mac-arm64
          - mac-x64
          - linux-arm64
          - windows-x64

concurrency:
  group: release-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  set-version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - id: resolve
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            V="${{ github.ref_name }}"
          else
            V="${{ inputs.version }}"
          fi
          # Strip leading 'v'
          V="${V#v}"
          echo "version=$V" >> "$GITHUB_OUTPUT"

  build-mac:
    name: macOS (arm64)
    needs: set-version
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'mac-arm64' }}
    runs-on: macos-14
    environment: CSC_KEY_PASSWORD
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('frontend/apps/desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      # ── Apple code-signing credentials ──────────────────────────
      # CSC_LINK: base64-encoded .p12 certificate
      # APPLE_API_KEY: base64-encoded App Store Connect API .p8 key
      - name: Import signing certificate
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK_B64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          echo "$CSC_LINK_B64" | base64 -d > /tmp/valuz-mac.p12
          echo "CSC_LINK=/tmp/valuz-mac.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      - name: Import Apple notarization key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY_B64" | base64 -d > /tmp/AuthKey.p8
          echo "APPLE_API_KEY_PATH=/tmp/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      # ── Build ──────────────────────────────────────────────────
      - name: Build desktop app (signed + publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALUZ_VERSION: ${{ needs.set-version.outputs.version }}
        run: |
          bash scripts/build-desktop.sh --signed

      - name: List artifacts
        run: ls -lh frontend/apps/desktop/release/

      # electron-builder must produce latest-mac.yml — it's the manifest
      # electron-updater fetches to discover updates. A release without it
      # (v0.1.2 / v0.1.3 shipped like this) silently breaks auto-update for
      # every existing mac user. Fail loud here so we never ship a broken
      # release; the failure() step below uploads the build log for diagnosis.
      - name: Verify latest-mac.yml generated
        run: |
          yml="frontend/apps/desktop/release/latest-mac.yml"
          if [ ! -s "$yml" ]; then
            echo "::error::latest-mac.yml missing or empty — auto-update will break for all mac users"
            exit 1
          fi
          echo "--- $yml ---"
          cat "$yml"
          expected="${{ needs.set-version.outputs.version }}"
          actual=$(awk '/^version:/{print $2}' "$yml")
          if [ "$actual" != "$expected" ]; then
            echo "::error::latest-mac.yml version '$actual' != tag version '$expected'"
            exit 1
          fi
          echo "OK: latest-mac.yml present, version=$actual"

      # electron-builder refuses to upload if the release was published >2h ago.
      # Use gh as a fallback to guarantee the artifact lands in the release.
      - name: Ensure artifacts uploaded to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.set-version.outputs.version }}"
          shopt -s nullglob
          files=(frontend/apps/desktop/release/*.dmg frontend/apps/desktop/release/*.zip frontend/apps/desktop/release/*.blockmap frontend/apps/desktop/release/latest-mac.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found to upload"
            exit 0
          fi
          echo "Uploading ${#files[@]} artifact(s) to release $TAG"
          gh release upload "$TAG" "${files[@]}" --clobber --repo valuz-ai/valuz-oss

      # ── Mirror artifacts + live manifest to Tencent COS ────────────
      # Auto-update reads from COS via CDN (files.valuz.cn); GitHub Releases
      # is the manual-download + backup path. The merge job overwrites this
      # single-arch manifest with a merged multi-arch one on a full tag push.
      # On a single-platform mac dispatch (merge skipped) this becomes live.
      - name: Setup coscli
        run: bash scripts/install-coscli.sh

      - name: Upload to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          VALUZ_EDITION: oss
        run: |
          bash scripts/upload-to-cos.sh \
            --edition="$VALUZ_EDITION" \
            --version="${{ needs.set-version.outputs.version }}" \
            --release-dir=frontend/apps/desktop/release/ \
            --manifests="latest-mac.yml"

      # Save this arch's manifest for the merge job. The two mac jobs each emit
      # an arch-specific latest-mac.yml and would otherwise overwrite each other
      # on the release, leaving it single-arch (see the merge-mac-manifest job).
      - name: Save mac manifest (arm64) for the merge
        uses: actions/upload-artifact@v4
        with:
          name: mac-manifest-arm64
          path: frontend/apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

      # ── Upload build log on failure ────────────────────────────
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            frontend/apps/desktop/release/*.blockmap
            frontend/apps/desktop/release/*.dmg
            frontend/apps/desktop/release/latest-mac.yml
          if-no-files-found: warn

  build-mac-x64:
    name: macOS (x86_64)
    needs: set-version
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'mac-x64' }}
    runs-on: macos-15-intel
    environment: CSC_KEY_PASSWORD
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/electron
          key: electron-${{ runner.os }}-${{ hashFiles('frontend/apps/desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      # ── Apple code-signing credentials ──────────────────────────
      - name: Import signing certificate
        env:
          CSC_LINK_B64: ${{ secrets.CSC_LINK_B64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          echo "$CSC_LINK_B64" | base64 -d > /tmp/valuz-mac.p12
          echo "CSC_LINK=/tmp/valuz-mac.p12" >> "$GITHUB_ENV"
          echo "CSC_KEY_PASSWORD=$CSC_KEY_PASSWORD" >> "$GITHUB_ENV"
          echo "CSC_IDENTITY_AUTO_DISCOVERY=false" >> "$GITHUB_ENV"

      - name: Import Apple notarization key
        env:
          APPLE_API_KEY_B64: ${{ secrets.APPLE_API_KEY_B64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          echo "$APPLE_API_KEY_B64" | base64 -d > /tmp/AuthKey.p8
          echo "APPLE_API_KEY_PATH=/tmp/AuthKey.p8" >> "$GITHUB_ENV"
          echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID" >> "$GITHUB_ENV"
          echo "APPLE_API_ISSUER=$APPLE_API_ISSUER" >> "$GITHUB_ENV"

      # ── Build ──────────────────────────────────────────────────
      - name: Build desktop app (signed + publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALUZ_VERSION: ${{ needs.set-version.outputs.version }}
        run: |
          bash scripts/build-desktop.sh --signed

      - name: List artifacts
        run: ls -lh frontend/apps/desktop/release/

      # Mirror of build-mac's verify step. mac-x64 emits the same latest-mac.yml
      # and (when this job runs) overwrites the arm64 one, so its output must be
      # just as correct. Job is scarce (CLAUDE.md) and often skipped — the assert
      # only fires when the job actually runs.
      - name: Verify latest-mac.yml generated
        run: |
          yml="frontend/apps/desktop/release/latest-mac.yml"
          if [ ! -s "$yml" ]; then
            echo "::error::latest-mac.yml missing or empty — auto-update will break for all mac users"
            exit 1
          fi
          echo "--- $yml ---"
          cat "$yml"
          expected="${{ needs.set-version.outputs.version }}"
          actual=$(awk '/^version:/{print $2}' "$yml")
          if [ "$actual" != "$expected" ]; then
            echo "::error::latest-mac.yml version '$actual' != tag version '$expected'"
            exit 1
          fi
          echo "OK: latest-mac.yml present, version=$actual"

      # electron-builder refuses to upload if the release was published >2h ago.
      # Use gh as a fallback to guarantee the artifact lands in the release.
      - name: Ensure artifacts uploaded to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.set-version.outputs.version }}"
          shopt -s nullglob
          files=(frontend/apps/desktop/release/*.dmg frontend/apps/desktop/release/*.zip frontend/apps/desktop/release/*.blockmap frontend/apps/desktop/release/latest-mac.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found to upload"
            exit 0
          fi
          echo "Uploading ${#files[@]} artifact(s) to release $TAG"
          gh release upload "$TAG" "${files[@]}" --clobber --repo valuz-ai/valuz-oss

      # ── Mirror artifacts + live manifest to Tencent COS ────────────
      # See build-mac for the rationale. The merge job overwrites this
      # single-arch manifest with the merged multi-arch one on a full tag push.
      - name: Setup coscli
        run: bash scripts/install-coscli.sh

      - name: Upload to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          VALUZ_EDITION: oss
        run: |
          bash scripts/upload-to-cos.sh \
            --edition="$VALUZ_EDITION" \
            --version="${{ needs.set-version.outputs.version }}" \
            --release-dir=frontend/apps/desktop/release/ \
            --manifests="latest-mac.yml"

      # Save this arch's manifest for the merge job (mirror of build-mac).
      - name: Save mac manifest (x64) for the merge
        uses: actions/upload-artifact@v4
        with:
          name: mac-manifest-x64
          path: frontend/apps/desktop/release/latest-mac.yml
          if-no-files-found: error
          retention-days: 1

      # ── Upload build log on failure ────────────────────────────
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-mac-x64
          path: |
            frontend/apps/desktop/release/*.blockmap
            frontend/apps/desktop/release/*.dmg
            frontend/apps/desktop/release/latest-mac.yml
          if-no-files-found: warn

  build-linux-arm64:
    name: Linux (arm64)
    needs: set-version
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'linux-arm64' }}
    runs-on: ubuntu-22.04-arm
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: electron-${{ runner.os }}-${{ hashFiles('frontend/apps/desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libffi-dev libssl-dev

      # ── Build ──────────────────────────────────────────────────
      - name: Build desktop app (unsigned + publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALUZ_VERSION: ${{ needs.set-version.outputs.version }}
        run: |
          bash scripts/build-desktop.sh

      - name: List artifacts
        run: ls -lh frontend/apps/desktop/release/

      # electron-builder must produce a latest-linux*.yml — it's the manifest
      # electron-updater fetches to discover linux updates. A release without it
      # (v0.1.3 shipped like this) silently breaks auto-update for every linux
      # user. Use a glob so future arch additions don't trip a false negative.
      - name: Verify latest-linux yml generated
        run: |
          shopt -s nullglob
          ymls=(frontend/apps/desktop/release/latest-linux*.yml)
          if [ ${#ymls[@]} -eq 0 ]; then
            echo "::error::no latest-linux*.yml generated — auto-update will break for linux users"
            exit 1
          fi
          expected="${{ needs.set-version.outputs.version }}"
          for yml in "${ymls[@]}"; do
            echo "--- $yml ---"
            cat "$yml"
            actual=$(awk '/^version:/{print $2}' "$yml")
            if [ "$actual" != "$expected" ]; then
              echo "::error::$yml version '$actual' != tag version '$expected'"
              exit 1
            fi
          done
          echo "OK: ${#ymls[@]} latest-linux yml(s) present, version=$expected"

      # electron-builder refuses to upload if the release was published >2h ago.
      # Use gh as a fallback to guarantee the artifact lands in the release.
      - name: Ensure artifacts uploaded to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.set-version.outputs.version }}"
          shopt -s nullglob
          files=(frontend/apps/desktop/release/*.AppImage frontend/apps/desktop/release/*.deb frontend/apps/desktop/release/*.blockmap frontend/apps/desktop/release/latest-linux*.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found to upload"
            exit 0
          fi
          echo "Uploading ${#files[@]} artifact(s) to release $TAG"
          gh release upload "$TAG" "${files[@]}" --clobber --repo valuz-ai/valuz-oss

      # ── Mirror artifacts + live manifest to Tencent COS ────────────
      # Auto-update reads from COS via CDN (files.valuz.cn); GitHub Releases
      # is the manual-download + backup path.
      - name: Setup coscli
        run: bash scripts/install-coscli.sh

      - name: Upload to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          VALUZ_EDITION: oss
        run: |
          bash scripts/upload-to-cos.sh \
            --edition="$VALUZ_EDITION" \
            --version="${{ needs.set-version.outputs.version }}" \
            --release-dir=frontend/apps/desktop/release/ \
            --manifests="latest-linux-arm64.yml"

      # ── Upload build log on failure ────────────────────────────
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-linux-arm64
          path: |
            frontend/apps/desktop/release/*.AppImage
            frontend/apps/desktop/release/*.deb
            frontend/apps/desktop/release/*.blockmap
            frontend/apps/desktop/release/latest-linux*.yml
          if-no-files-found: warn

  build-windows-x64:
    name: Windows (x64)
    needs: set-version
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' || inputs.platform == 'windows-x64' }}
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "25"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: cli/go.sum

      - name: Setup uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Electron binary
        uses: actions/cache@v4
        with:
          path: ~/AppData/Local/electron/Cache
          key: electron-${{ runner.os }}-${{ hashFiles('frontend/apps/desktop/package.json') }}
          restore-keys: electron-${{ runner.os }}-

      # ── Build ──────────────────────────────────────────────────
      - name: Build desktop app (unsigned + publish)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALUZ_VERSION: ${{ needs.set-version.outputs.version }}
          # uv's wheel install for the third-party-notices scan kept failing on
          # this runner with "os error 3" against the 8.3 short path
          # C:\Users\RUNNER~1\AppData\Local\Temp\… . Point uv's temp + cache at
          # the runner work-drive temp (a clean full path, no 8.3 alias) and
          # copy instead of hardlink (cache and venv can be on different drives).
          UV_LINK_MODE: copy
          UV_CACHE_DIR: ${{ runner.temp }}\uv-cache
          TMP: ${{ runner.temp }}
          TEMP: ${{ runner.temp }}
        shell: bash
        run: |
          bash scripts/build-desktop.sh

      - name: List artifacts
        shell: bash
        run: ls -lh frontend/apps/desktop/release/

      # electron-builder must produce latest.yml — it's the manifest
      # electron-updater fetches to discover windows updates. A release without
      # it (v0.1.2 / v0.1.3 shipped like this) silently breaks auto-update for
      # every windows user. shell: bash because the windows runner default is pwsh.
      - name: Verify latest.yml generated
        shell: bash
        run: |
          yml="frontend/apps/desktop/release/latest.yml"
          if [ ! -s "$yml" ]; then
            echo "::error::latest.yml missing or empty — auto-update will break for windows users"
            exit 1
          fi
          echo "--- $yml ---"
          cat "$yml"
          expected="${{ needs.set-version.outputs.version }}"
          actual=$(awk '/^version:/{print $2}' "$yml")
          if [ "$actual" != "$expected" ]; then
            echo "::error::latest.yml version '$actual' != tag version '$expected'"
            exit 1
          fi
          echo "OK: latest.yml present, version=$actual"

      # electron-builder refuses to upload if the release was published >2h ago.
      # Use gh as a fallback to guarantee the artifact lands in the release.
      - name: Ensure artifacts uploaded to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ needs.set-version.outputs.version }}"
          shopt -s nullglob
          files=(frontend/apps/desktop/release/*.exe frontend/apps/desktop/release/*.blockmap frontend/apps/desktop/release/latest.yml)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No artifacts found to upload"
            exit 0
          fi
          echo "Uploading ${#files[@]} artifact(s) to release $TAG"
          gh release upload "$TAG" "${files[@]}" --clobber --repo valuz-ai/valuz-oss

      # ── Mirror artifacts + live manifest to Tencent COS ────────────
      # Auto-update reads from COS via CDN (files.valuz.cn); GitHub Releases
      # is the manual-download + backup path. shell: bash because the windows
      # runner default is pwsh.
      - name: Setup coscli
        run: bash scripts/install-coscli.sh

      - name: Upload to Tencent COS
        shell: bash
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          VALUZ_EDITION: oss
        run: |
          bash scripts/upload-to-cos.sh \
            --edition="$VALUZ_EDITION" \
            --version="${{ needs.set-version.outputs.version }}" \
            --release-dir=frontend/apps/desktop/release/ \
            --manifests="latest.yml"

      # ── Upload build log on failure ────────────────────────────
      - name: Upload build artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-windows-x64
          path: |
            frontend/apps/desktop/release/*.exe
            frontend/apps/desktop/release/*.blockmap
            frontend/apps/desktop/release/latest.yml
          if-no-files-found: warn

  # macOS ships as two separate arch builds (arm64 on macos-14, x64 on
  # macos-15-intel). electron-builder emits ONE arch-specific latest-mac.yml per
  # job, and uploading both to the same release left the later one (x64) as the
  # published manifest — so electron-updater on an Apple Silicon Mac, finding no
  # arm64 entry, downloaded the Intel build (Rosetta → slow + macOS's "Intel app"
  # warning). electron-updater selects a mac file by "arm64" vs non-arm64 in the
  # name, so a correct manifest must list BOTH arches. This job merges the two
  # per-arch manifests into one and re-uploads it last.
  merge-mac-manifest:
    name: Merge mac update manifest (arm64 + x64)
    needs: [set-version, build-mac, build-mac-x64]
    # Only when both mac arches built (a tag push / platform=all). A single-arch
    # workflow_dispatch skips one mac job, so skip the merge too.
    if: ${{ github.event_name == 'push' || inputs.platform == 'all' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download arm64 manifest
        uses: actions/download-artifact@v4
        with:
          name: mac-manifest-arm64
          path: arm64
      - name: Download x64 manifest
        uses: actions/download-artifact@v4
        with:
          name: mac-manifest-x64
          path: x64
      - name: Merge into one multi-arch latest-mac.yml
        run: |
          python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import yaml
          arm = yaml.safe_load(open("arm64/latest-mac.yml"))
          x64 = yaml.safe_load(open("x64/latest-mac.yml"))
          # Union both arches' files, deduped by url — electron-updater filters
          # this list by "arm64" (arm hosts) vs non-arm64 (x64 hosts), so it must
          # carry both arm64 and amd64 zips/dmgs.
          seen, files = set(), []
          for f in (arm.get("files") or []) + (x64.get("files") or []):
              if f["url"] not in seen:
                  seen.add(f["url"])
                  files.append(f)
          if not any("arm64" in f["url"] for f in files):
              raise SystemExit("merge: no arm64 file present — refusing to publish")
          if not any("arm64" not in f["url"] for f in files):
              raise SystemExit("merge: no x64 file present — refusing to publish")
          merged = dict(arm)
          merged["files"] = files
          with open("latest-mac.yml", "w") as fh:
              yaml.safe_dump(merged, fh, sort_keys=False, default_flow_style=False, width=4096)
          print(open("latest-mac.yml").read())
          PY
      # Merged latest-mac.yml goes to BOTH targets: GitHub Releases (manual
      # download + backup) and Tencent COS (the live auto-update feed, CDN-served
      # via files.valuz.cn). This is the authoritative mac manifest — overwrites
      # whatever the individual mac jobs pushed as single-arch manifests.
      - name: Setup coscli
        run: bash scripts/install-coscli.sh

      - name: Upload merged latest-mac.yml to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "v${{ needs.set-version.outputs.version }}" latest-mac.yml --clobber --repo valuz-ai/valuz-oss

      - name: Upload merged latest-mac.yml to Tencent COS
        env:
          TENCENT_SECRET_ID: ${{ secrets.TENCENT_SECRET_ID }}
          TENCENT_SECRET_KEY: ${{ secrets.TENCENT_SECRET_KEY }}
          TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
          TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
          VALUZ_EDITION: oss
          VALUZ_VERSION: ${{ needs.set-version.outputs.version }}
        run: |
          # coscli reads its config from $HOME/.cos.yaml (NOT .coscli/config.yaml).
          # We write it there AND pass -c explicitly so we're robust to a
          # future coscli release changing the default path. The bucket alias
          # is "valuz" — every COS path uses cos://valuz/<key>. The
          # TENCENT_COS_BUCKET secret must be in <name>-<appid> form.
          COS_ENDPOINT="cos.${TENCENT_COS_REGION}.myqcloud.com"
          COS_CONFIG="$HOME/.cos.yaml"
          cat > "$COS_CONFIG" <<YAML
          cos:
            base:
              secretid: ${TENCENT_SECRET_ID}
              secretkey: ${TENCENT_SECRET_KEY}
              sessiontoken: ""
            buckets:
              - name: ${TENCENT_COS_BUCKET}
                alias: valuz
                endpoint: ${COS_ENDPOINT}
          YAML
          # Rewrite url:/path: to carry the v${VERSION}/ prefix — the live
          # manifest sits at ${EDITION}/ but its artifacts live one level
          # down at ${EDITION}/v${VERSION}/. See scripts/upload-to-cos.sh
          # for the same transform on the per-platform live manifests.
          sed -e 's|url: |url: v'"$VALUZ_VERSION"'/|g' \
              -e 's|^path: |path: v'"$VALUZ_VERSION"'/|' \
              latest-mac.yml > latest-mac.yml.live
          coscli -c "$COS_CONFIG" cp latest-mac.yml.live "cos://valuz/${VALUZ_EDITION}/latest-mac.yml"
          echo "Live mac manifest: https://files.valuz.cn/${VALUZ_EDITION}/latest-mac.yml"
