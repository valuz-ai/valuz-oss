[project]
name = "valuz-oss-backend"
version = "0.2.0"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "alembic>=1.13",
    "typer>=0.12",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "cryptography>=43.0",
    # Bundles the Claude Code CLI; floor must match upstream agent-harness.
    # Kernel pin eec331f (dynamic workflows) needs the CLI's ``Workflow`` tool;
    # session-modes (cb25177) needs the ``/goal`` slash (CLI >=2.1.146). The old
    # ``>=0.1.68`` bundled a CLI without ``/goal`` → goal-mode turns no-op'd
    # (0-token end_turn); a stale-but-present SDK throws no ImportError, so the
    # floor must be reconciled by hand on every kernel bump (upgrade SOP §2b).
    # >=0.2.95 bundled CLI 2.1.170 — required for the claude-fable-5 model.
    # >=0.2.123 bundles CLI 2.1.215; picks up the typed ``TaskUpdatedMessage``
    # (0.2.101, a SystemMessage subclass — our task_updated branch still
    # matches), zombie-subprocess + NDJSON large-line fixes (0.2.111), and the
    # ``--resume=``/``--session-id=`` argv-injection hardening (0.2.121).
    # >=0.2.128 bundles CLI 2.1.220 — required for the claude-opus-5 model
    # (added in CLI 2.1.219 / first bundled by 0.2.127); also picks up the
    # premature-stdin-closure fix for in-flight background tasks (0.2.127).
    "claude-agent-sdk>=0.2.128",
    "openai-agents>=0.14.6",
    # Routes OpenAI-compatible models (incl. Reportify proxy on
    # http://172.20.2.240:8080) through the kernel's deepagents runtime.
    # Floor >=0.5.5: first release with the FilesystemBackend symlink-loop fix
    # (langchain-ai/deepagents#3035) — earlier versions re-raise OSError(ELOOP)
    # from a symlinked/cyclic SKILL.md, crashing skill discovery for the whole
    # session. We were pinned to 0.5.3 and resolving 0.5.4, the last release
    # without the fix.
    "deepagents>=0.5.5",
    "langchain-openai>=1.2.1",
    # OSS BPE tokenizer for the goal-mode length fence (adapters/agent_resolver
    # ``estimate_tokens``): counts a task/subtask goal in tokens to decide when to
    # spill it to a doc. Arrives transitively via langchain-openai too, but the
    # host imports it directly so we declare it explicitly. Counting degrades to a
    # char heuristic if the vocab can't load (offline packaged build).
    "tiktoken>=0.7",
    # Loaded by the kernel's DeepAgentsRuntime when a session pairs
    # ``runtime_provider="deepagents"`` with ``api_protocol="anthropic"``.
    # Valuz today maps anthropic→claude_agent (not deepagents), so this
    # path isn't exercised — we still declare the dep to match upstream
    # so a future routing change doesn't ImportError mid-turn.
    "langchain-anthropic>=1.4.1",
    # Loaded by the kernel's DeepAgentsRuntime when a session pairs
    # ``runtime_provider="deepagents"`` with ``api_protocol="gemini"``.
    # Valuz today has no provider routed to gemini, but mirror upstream so
    # a future routing change doesn't ImportError mid-turn (per kernel
    # upgrade SOP step 2b).
    "langchain-google-genai>=4.2.2",
    "langchain-mcp-adapters>=0.2.2",
    # DeepAgentsRuntime persists thread state into a SQLite checkpoint so
    # conversation history survives kernel restarts (kernel
    # ``DEEPAGENTS_CHECKPOINT_DB`` env, defaults to a file next to the
    # working dir; the host points it at the valuz DB — see
    # ``boot/kernel._set_kernel_env``). Missing this dep
    # surfaces as ``No module named 'langgraph.checkpoint.sqlite'`` on
    # the first OpenAI-protocol turn.
    "langgraph-checkpoint-sqlite>=2.0",
    "jinja2>=3.1",
    "httpx[socks]>=0.27",
    "python-dotenv>=1.0",
    "pymupdf4llm==1.27.2.3",
    # Office/spreadsheet backend for LightLocal (Rust, MIT). Replaced
    # ``markitdown``, which converted only docx/xlsx/pptx and routed sheets
    # through pandas (a large revenue cell rendered as ``8.630000e+10``, every
    # empty cell as ``NaN``). anydoc covers the whole ``_OFFICE_EXTS`` table —
    # legacy OLE (.doc/.ppt/.xls), OpenDocument, RTF, EPUB — detects the format
    # from the bytes, and ships cp310-abi3 wheels for every platform we package:
    # mac arm64/x64, linux x64/aarch64, win x64.
    "firecrawl-anydoc>=0.1.6,<0.2",
    # HTML→Markdown for LightLocal (MIT, a modernized markdownify fork by
    # Goldziher / Na'aman Hirschfeld). Pinned to the 1.x line which is
    # pure-Python; the 2.x+ rewrite under the Kreuzberg org introduces a Rust
    # core we don't need for this scale of HTML. Exposes a ``markdownify``
    # callable, which is how ``_parse_html`` calls it.
    "html-to-markdown>=1.0,<2.0",
    # Deterministic block/list/table positions for Citation Claim Audit.
    "markdown-it-py>=4.0,<5.0",
    # Image OCR for the LightLocal parser (KB image documents). rapidocr 3.x
    # supports PP-OCRv5 (the older ``rapidocr-onnxruntime`` package is frozen at
    # PP-OCRv4); its public API uses OmegaConf params
    # (``RapidOCR(params={"Det.model_path": ...})``). The ``light_local``
    # provider + setup-job downloader expect ≥3.3.0. A DEFAULT dep (not an
    # optional extra) so ``uv sync`` never prunes it — image parsing returned
    # ``not_installed`` when this lived under an extra the dev launcher dropped.
    "rapidocr>=3.3.0",
    # rapidocr's inference engine. rapidocr defaults to ``engine_name:
    # onnxruntime`` but does NOT declare it (its deps are only opencv/numpy/…),
    # so it must be installed explicitly — otherwise OCR has no backend. It
    # used to arrive transitively via magika (markitdown's filetype detector);
    # that whole tail left with markitdown, so this direct pin is now the ONLY
    # thing keeping an inference engine in the tree.
    #
    # Platform split — onnxruntime dropped macOS *x86_64* (Intel) wheels after
    # 1.19.2: 1.17–1.19 ship a ``macosx_11_0_universal2`` build (runs on both
    # Intel + Apple Silicon), but 1.20.0+ ship arm64-only mac wheels. So an
    # Intel-Mac dev box has no wheel for the modern line and ``uv sync`` aborts
    # the whole install. pymupdf-layout (the only other requester, now that
    # magika left with markitdown) declares NO onnxruntime floor, so OUR pin is
    # the only upward pressure;
    # capping Intel Mac at <1.20 lets it resolve to the 1.19.2 universal2 wheel
    # (OCR/layout still work, just on the older engine). Every other platform —
    # Apple Silicon, Linux, Windows — stays on the modern line.
    "onnxruntime>=1.20; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "onnxruntime>=1.17,<1.20; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    # Same platform split for opencv-python (also a rapidocr transitive dep, no
    # version floor declared upstream). opencv-python dropped the Intel-macOS-13
    # wheel at 4.13: 4.12.0.88 ships ``macosx_13_0_x86_64``, but 4.13.x bumped
    # the Intel-mac wheel's deployment target to 14.0, so an Intel Mac on macOS
    # 13 (Ventura) has NO wheel and ``uv sync`` aborts the whole install. Cap
    # Intel Mac at <4.13 (resolves to 4.12.0.88 — OCR still works); every other
    # platform — Apple Silicon, Linux, Windows — stays on the modern line.
    "opencv-python>=4.13; sys_platform != 'darwin' or platform_machine != 'x86_64'",
    "opencv-python>=4.11,<4.13; sys_platform == 'darwin' and platform_machine == 'x86_64'",
    "croniter>=6.2.2",
    "cron-descriptor>=2.0.8",
    "pytz>=2026.1.post1",
    "types-pytz>=2026.1.1.20260408",
    "types-croniter>=6.2.2.20260408",
    "types-pyyaml>=6.0",
    # ``yaml`` is imported eagerly by ``kernel/src/core/skills.py`` (via
    # ``src.core.__init__`` re-export), so any host import of
    # ``from src.core import …`` triggers it. Today it arrives transitively,
    # but declare it explicitly to match the upstream kernel pyproject and
    # protect against a future transitive-dep drop.
    "pyyaml>=6.0",
    # Required by the kernel's ``CodexRuntime`` (``from openai_codex import
    # CodexConfig``). The kernel's ``runtimes/codex/__init__.py`` re-exports
    # CodexRuntime eagerly, so any import of ``src.runtimes.codex`` would
    # explode with ``ModuleNotFoundError: No module named 'openai_codex'``.
    # Kernel pin eec331f moved codex off the vendored 0.131.0a4 wheel
    # (``AppServerConfig``) to the published PyPI package (``CodexConfig``).
    # Floored at ``0.144.4`` — the first STABLE release (upstream PR #33213):
    # the SDK version line switched from ``0.1.0bX`` betas to tracking the
    # Codex CLI version, and its pinned ``openai-codex-cli-bin==0.144.4``
    # ships wheels for every ``required-environment`` (manylinux glibc both
    # arches, Intel + arm64 macOS — see the ``[tool.uv]`` note below). The
    # binary is pulled transitively and KEPT on every platform so
    # ``_resolve_codex_bin`` prefers it over a stray PATH ``codex``.
    "openai-codex>=0.144.4",
    "python-socks[asyncio]>=2.4",
    "lark-oapi>=1.7.1",
]

# Note: built-in parser plugins live in ``backend/parser_plugins/`` and
# are discovered by convention (see ``modules/parser/registry.py``).
# Only out-of-tree third-party plugins use the entry-point group below,
# and that group lives on THEIR own pyproject — declaring it here for
# built-ins would create a double-discovery path (entry-point + scan)
# with no benefit. The entry-point GROUP NAME is part of the public
# plugin contract though, so it's documented here:
#
#   [project.entry-points."valuz.parser_plugins"]
#   my_plugin = "my_pypi_pkg:make_plugin"

[tool.setuptools.packages.find]
# Include the convention-discovery top-level ``plugins`` package
# alongside the main host module. ``plugins`` is a sibling top-level
# package — not nested under ``valuz_agent`` — so the same directory
# layout can lift out cleanly into separate pypi packages in Phase 2
# (e.g. ``plugins/parser/mineru/`` → ``valuz-parser-mineru``).
include = ["valuz_agent*", "plugins*", "kernel"]

[project.optional-dependencies]
# NOTE: ``rapidocr`` (image OCR) moved to the default ``[project] dependencies``
# — keeping it under an extra meant ``uv sync`` (dev launcher) pruned it and KB
# image parsing failed with ``not_installed``.
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "mypy>=1.10",
    "ruff>=0.5",
    "jsonschema>=4.23",
    "httpx[socks]>=0.27",
    # Test-fixture builder only — writes the .xlsx that pins anydoc's
    # spreadsheet output (no pandas artifacts). It used to arrive at runtime via
    # markitdown's ``xlsx`` extra; anydoc reads sheets in Rust and needs nothing
    # from Python, so openpyxl belongs here and must NOT return to the runtime
    # dependency list.
    "openpyxl>=3.1",
]
# PostgreSQL async driver for the remote data-service deployment (SaaS / B-real).
# Opt-in: OSS local-first runs on SQLite (aiosqlite) and never needs this, so the
# desktop bundle stays lean. The data service syncs it explicitly
# (``uv sync --extra postgres``). ``config._to_async_url`` maps
# ``postgresql://…`` → ``postgresql+asyncpg://…`` so SQLAlchemy picks this driver.
postgres = [
    "asyncpg>=0.29",
]
# Langfuse LLM observability (self-hosted or cloud). Opt-in: the default
# local-first deployment never traces, so the desktop bundle stays lean.
# Activation ALSO requires the LANGFUSE_BASE_URL/PUBLIC_KEY/SECRET_KEY env —
# with the extra installed but no env, ``src.core.tracing`` stays a no-op.
# langfuse>=4.14 — v4 line (``propagate_attributes``; v3's ``update_trace``
# APIs are gone). ONLY langfuse: claude_agent/codex turns are traced from
# the kernel's own cross-runtime event stream (``TurnTrace`` — no SDK
# instrumentation package; openinference's claude instrumentor only spans
# ``receive_response()``, which our runtime never calls), and deepagents
# uses langfuse's own LangChain callback handler.
tracing = [
    "langfuse>=4.14",
]

[tool.uv]
# ``openai-codex-cli-bin`` — the version-pinned codex binary that
# ``openai-codex`` pulls in transitively — historically shipped ONLY
# ``musllinux`` wheels for Linux (no ``manylinux``/glibc build). uv won't install
# a musl wheel on a glibc host, so ``uv sync`` aborted on the glibc Linux CI
# runners and we dropped the binary on Linux with an ``override-dependencies``
# marker (``sys_platform != 'linux'``).
#
# As of ``openai-codex`` 0.1.0b3 (which pins ``openai-codex-cli-bin==0.137.0a4``)
# upstream publishes ``manylinux_2_17`` glibc wheels (x86_64 + aarch64) alongside
# the macOS/Windows/musllinux ones, so the binary now resolves natively on every
# ``required-environment`` — including glibc Linux and Intel macOS. The Linux-skip
# override is therefore gone: codex ships in the locked closure on all platforms,
# matching upstream, and ``_resolve_codex_bin`` gets the pinned binary everywhere
# (the cloud Linux kernel image no longer needs a hand-extracted musl binary).
#
# The constraint below is NOT a dependency — ``openai-codex`` alone owns which
# ``openai-codex-cli-bin`` ships (its transitive ``==`` pin). It exists because
# uv only accepts a transitive PRERELEASE pin when the package appears with a
# prerelease specifier in direct dependencies or constraints. Since
# ``openai-codex`` 0.144.4 the transitive pin is a stable version, so the hint
# is currently dormant — kept because it costs nothing and re-arms
# automatically if upstream ever pins a prerelease binary again. The floor
# never needs bumping when ``openai-codex`` advances (it also documents the
# first codex binary with a ``manylinux`` wheel, which the glibc Linux cloud
# image depends on).
constraint-dependencies = ["openai-codex-cli-bin>=0.137.0a4"]

# The lockfile MUST stay installable on Intel macOS (x86_64 darwin) — our
# lowest-common-denominator dev box (a 2019 Intel MBP on Ventura). Without this,
# uv happily locks a version whose only mac wheel is arm64 or targets a newer
# macOS (opencv-python 4.13 -> macosx_14, onnxruntime 1.20 -> arm64-only) and
# the failure only surfaces at ``uv sync`` on that machine. Declaring the env
# here makes ``uv lock`` (and CI) fail fast instead. ``aarch64`` is the dev
# default and always covered; this just pins the Intel-mac corner explicitly.
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'x86_64'",
]

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["valuz_agent/resources"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"valuz_agent/api/routes/*.py" = ["B008"]  # FastAPI Depends() in default args is idiomatic
"**/errors.py" = ["N818"]  # Domain exceptions prefer SkillNotFound over SkillNotFoundError

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
mypy_path = "$MYPY_CONFIG_FILE_DIR/kernel/src"
exclude = [
    "^kernel/",
    "^valuz_agent/resources/",
    "^valuz_agent/migrations/",
]
[[tool.mypy.overrides]]
# ``follow_imports = "skip"`` for ``src.*`` / ``kernel.*`` means host mypy never
# descends into the vendored kernel's bodies — it treats kernel imports as Any.
module = [
    "app.*",
    "kernel.*",
    "src.*",
]
follow_imports = "skip"
ignore_missing_imports = true

[[tool.mypy.overrides]]
# ``codex_cli_bin`` (the binary-bundling package the ``openai-codex`` SDK
# installs) ships no stubs / ``py.typed``. The host now imports it directly in
# ``adapters/runtime_registry`` to resolve the bundled codex for the runtime
# availability probe, so suppress its missing-stub error (mirrors the upstream
# kernel's own ``ignore_missing_imports`` for this module).
module = ["codex_cli_bin"]
ignore_missing_imports = true

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
markers = [
    "integration: marks tests that require external services (deselect with '-m not integration')",
]

[dependency-groups]
dev = [
    "mypy>=1.20.2",
    "pyinstaller>=6.20.0",
]
