            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"

    delete:
      summary: Delete session
      operationId: deleteSession
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Session deleted

  /v1/sessions/{session_id}/events:
    get:
      summary: List session events
      operationId: listSessionEvents
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: after_seq
          in: query
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Session events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionEventsResponse"

  /v1/sessions/{session_id}/messages:
    post:
      summary: Send message to session
      operationId: sendMessage
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionMessageRequest"
      responses:
        "200":
          description: Run response with events
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRunResponse"
        "409":
          description: Session already running

  /v1/sessions/{session_id}/messages/stream:
    post:
      summary: Send message and stream events via SSE
      operationId: sendMessageStream
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionMessageRequest"
      responses:
        "200":
          description: SSE event stream
          content:
            text/event-stream:
              schema:
                type: string
                description: Server-sent events with SessionEventEnvelope data
        "404":
          description: Session not found
        "409":
          description: Session already running

  /v1/sessions/{session_id}/interrupt:
    post:
      summary: Interrupt running session
      operationId: interruptSession
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session interrupted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"

  /v1/sessions/{session_id}/queue:
    get:
      summary: List queued follow-up inputs for a session
      description: |
        Inputs submitted while a turn was running, awaiting FIFO drain after
        the active turn completes. Returns ``queued`` + ``blocked`` items and
        whether auto-drain is currently paused (after an interrupt).
        See docs/design/session-input-queue.md.
      operationId: listSessionQueue
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Queued inputs (FIFO) + paused flag
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedInputList"
        "404":
          description: Session not found
    post:
      summary: Enqueue a follow-up input (runs after the active turn)
      description: |
        Append a user message to the session's input queue. If the session is
        idle this drains immediately; if a turn is running it waits for FIFO
        drain. Pending attachments are snapshotted and consumed at enqueue
        time so they ride this item only. Returns the updated queue.
      operationId: enqueueSessionInput
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueuedInputCreate"
      responses:
        "200":
          description: Updated queue (FIFO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedInputList"
        "404":
          description: Session not found
        "409":
          description: Queue is full (soft cap reached) or session not runnable

  /v1/sessions/{session_id}/queue/{queue_id}:
    patch:
      summary: Edit a queued input (only while still queued)
      operationId: editSessionQueuedInput
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: queue_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QueuedInputPatch"
      responses:
        "200":
          description: Updated queue (FIFO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedInputList"
        "404":
          description: Session or queued input not found
        "409":
          description: Queued input is no longer editable (already dispatched)
    delete:
      summary: Delete a queued input
      operationId: deleteSessionQueuedInput
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: queue_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated queue (FIFO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedInputList"
        "404":
          description: Session or queued input not found

  /v1/sessions/{session_id}/queue/resume:
    post:
      summary: Resume draining a paused queue (after an interrupt)
      operationId: resumeSessionQueue
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated queue (FIFO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedInputList"
        "404":
          description: Session not found

  /v1/sessions/{session_id}/queue/{queue_id}/steer:
    post:
      summary: Steer — send a queued input now, interrupting the active turn
      description: >
        Promote this queued input to the head of the FIFO, clear any
        interrupt soft-pause, and — if a turn is in flight — interrupt it
        silently (no user_interrupt stamp) so the host drain dispatches this
        item immediately. Lossy: the in-flight turn's partial progress is
        discarded. The runtime-agnostic stand-in for Codex ``turn/steer``.
        See docs/design/session-input-queue.md §11.
      operationId: steerSessionQueuedInput
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
        - name: queue_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated queue (FIFO)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueuedInputList"
        "404":
          description: Session or queued input not found

  /v1/sessions/{session_id}/cancel:
    post:
      summary: Cancel session
      operationId: cancelSession
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Session cancelled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"

  /v1/sessions/{session_id}/regenerate:
    post:
      summary: Regenerate last assistant turn
      operationId: regenerateSession
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Regenerated response
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionRunResponse"

  /v1/sessions/{session_id}/permission-mode:
    patch:
      summary: Update session approval mode
      description: |
        Change the approval mode for an existing session (kernel
        V5+1aae940; live-reconcile since V5+bba3014). The new mode
        applies on the next Send: Claude uses ``set_permission_mode``
        (with fork-on-rebuild for the bypass tier — G1/G2 CLI
        gotchas); Codex threads ``approval_policy`` / ``sandbox_policy``
        per-turn via ``turn_kwargs``; DeepAgents drops its cached graph
        for a cold rebuild. A turn already in flight keeps the mode it
        started with. DeepAgents sessions reject ``auto_review`` (400 —
        only the Claude tier ships the LLM classifier today).
      operationId: updateSessionPermissionMode
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionPermissionModeRequest"
      responses:
        "200":
          description: Mode updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "400":
          description: Invalid mode for this runtime (e.g. auto_review on deepagents)
        "404":
          description: Session not found

  /v1/sessions/{session_id}/effort:
    patch:
      summary: Update session reasoning-effort budget
      description: |
        Change the reasoning-effort budget for an existing session
        (kernel V5+bba3014). Live-reconcile: the new effort applies on
        the next Send. Claude cold-reloads the SDK client (effort is a
        build-time option); Codex drops it into
        ``turn_kwargs.reasoning_effort`` (survives ``--resume``);
        DeepAgents drops its cached graph so the next turn rebuilds
        the langchain chat client with the new value.

        Per-runtime value mapping:
          * Claude: pass-through all 5 values.
          * Codex: ``max`` clamps to ``xhigh``.
          * DeepAgents openai-completion: ``max`` → ``xhigh``.
          * DeepAgents anthropic: pass-through.
          * DeepAgents gemini: ``xhigh|max`` → ``high``.

        ``effort=null`` resets to the SDK default.
      operationId: updateSessionEffort
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionEffortRequest"
      responses:
        "200":
          description: Effort updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionDetail"
        "400":
          description: Invalid effort value (not in low|medium|high|xhigh|max)
        "404":
          description: Session not found

  /v1/sessions/{session_id}/actions:
    post:
      summary: Resolve a pending approval
      description: |
        Resolve a pending ``requires_action`` event with a user
        decision (kernel V5+1aae940 — cross-runtime tool approval
        contract v1). Idempotent on ``(pending_id, decision)``;
        conflicting decisions for the same ``pending_id`` return 409
        with the original ``accepted_at``. Expired / interrupted
        pendings return 410. Same shape as the kernel-side
        ``POST /kernel/v1/sessions/{session_id}/actions`` (ADR-013;
        default ``/api/v1/...`` upstream — see
        ``kernel/app/routes/__init__.py``); both routes reach the same
        orchestrator.
      operationId: submitSessionAction
      tags: [sessions]
      parameters:
        - name: session_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionActionRequest"
      responses:
        "200":
          description: Decision accepted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionActionResponse"
        "400":
          description: Decision shape invalid for this pending's subject
        "404":
          description: Session or pending action not found
        "409":
          description: Pending already resolved with a different decision
        "410":
          description: Pending already expired / interrupted, or project deleted
        "501":
          description: Runtime has not implemented the approval bridge

  /v1/sessions/{session_id}/skills:
    get:
      summary: Get the per-session attached skill list
      description: |
        skill-creator is always active and is not included in this list.
        The returned ids reflect skills the user has explicitly attached
        to this session (e.g. via the in-chat skill picker).
      operationId: getSessionExtraSkills
      tags: [sessions]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Attached skill ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExtraSkillsResponse"
    put:
      summary: Replace the per-session attached skill list
      description: |
        Replaces (not appends) the previous list. skill-creator does not need
        to be listed; it is always active regardless.
      operationId: setSessionExtraSkills
      tags: [sessions]
      parameters:
        - in: path
          name: session_id
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SessionExtraSkillsRequest"
      responses:
        "200":
          description: Attached skill ids
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SessionExtraSkillsResponse"

  /v1/onboarding/example-project:
    post:
      summary: Create (or reuse) the onboarding example project
      operationId: createExampleProject
      tags: [onboarding]
      description: |
        One-shot endpoint called at the end of the onboarding flow.
        Creates ~/Valuz/示例项目, binds it as a project, and deploys
        the four official agents for the selected preset team.
        Fully idempotent — safe to call again if the user re-runs onboarding.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExampleProjectRequest"
      responses:
        "200":
          description: Project created or reused successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExampleProjectResponse"
        "422":
          description: Invalid team_id or project creation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/onboarding/assistant:
    post:
      summary: Create (or reuse) the general Valuz assistant
      operationId: createAssistant
      tags: [onboarding]
      description: |
        Creates (or reuses) the general 「Valuz 小助手」 in the user's agent
        library — backs TeamStep's「暂时不需要 team」choice. No project is
        created. Idempotent. Returns 422 if no model channel is configured.
      responses:
        "200":
          description: Assistant created or reused
          content:
            application/json:
              schema:
                type: object
                required: [agent_slug]
                properties:
                  agent_slug: {type: string}
        "422":
          description: No model channel configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/agent-templates:
    get:
      summary: List the official agent-team templates
      operationId: listAgentTemplates
      tags: [agent-templates]
      description: |
        Browse the bundled team templates (investment / Xiaohongshu / World Cup).
        Each template is a ready-made set of roles; `:add` copies the missing
        ones into the caller's library. Per-role `in_library` and per-template
        `added` report library state so the UI can mark a fully-present
        template as already added.
      responses:
        "200":
          description: Templates listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentTemplateList"

  /v1/agent-templates/{template_id}:add:
    post:
      summary: Add a template's roles to the caller's agent library
      operationId: addAgentTemplate
      tags: [agent-templates]
      description: |
        Batch-create the template's roles as user-owned agents (source=custom)
        using fixed per-role slugs for idempotent de-dup — roles already in the
        library are skipped, only the missing ones are created. Runtime / model /
        provider / effort follow the user's global defaults (same resolver as
        onboarding). Returns 422 when no model channel is configured.
      parameters:
        - in: path
          name: template_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Roles created and/or already present
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddAgentTemplateResponse"
        "404":
          description: Unknown template_id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: No model channel configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/agent-packs/export:
    post:
      summary: Export library agents as a downloadable .valuzpack archive
      operationId: exportAgentPack
      tags: [agent-templates]
      description: |
        Build a portable .valuzpack (zip) for the chosen library agents — their
        definitions (provider dropped, model demoted to a hint), embedded
        user-authored skills, and connector definitions with all secrets
        stripped. Bundled skills are referenced, not carried.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExportPackRequest"
      responses:
        "200":
          description: The .valuzpack archive
          content:
            application/zip:
              schema: {type: string, format: binary}
        "404":
          description: Unknown agent slug
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/agent-packs/import:
    post:
      summary: Upload a .valuzpack and stage it for import (preview)
      operationId: importAgentPack
      tags: [agent-templates]
      description: |
        Parse + stage an uploaded .valuzpack. Returns a preview of what it
        contains (agents, marking which already exist; skills; connectors,
        marking which need a key / local setup) plus a preview_id to confirm.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPackPreviewResponse"
        "400":
          description: Malformed or oversized archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/agent-packs/import/confirm:
    post:
      summary: Commit a staged .valuzpack import
      operationId: confirmAgentPackImport
      tags: [agent-templates]
      description: |
        Install the staged pack's skills, register its connectors, and create
        its agents (runtime/model/provider follow the user's defaults). Returns
        the created/skipped counts, the agents, and the connectors that still
        need the user's attention (key / local setup).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportPackConfirmRequest"
      responses:
        "200":
          description: Import committed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportPackConfirmResponse"
        "400":
          description: Preview expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/projects/{project_id}/export:
    get:
      summary: Export a project as a downloadable .valuzpack archive
      operationId: exportProject
      tags: [projects]
      description: |
        Build a portable .valuzpack (zip) for the given project in the unified
        pack format (schema_version 2, a `project` target) — its metadata, team
        members (slim handles referencing the hoisted top-level agents[]
        payload), automations, project-scoped skill configs, project-scoped
        connector slugs (definitions in the shared connectors[] index, secrets
        stripped), and the on-disk project memory directory. Chat projects are
        not exportable (422).
      parameters:
        - name: project_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: The .valuzpack archive
          content:
            application/zip:
              schema: {type: string, format: binary}
        "404":
          description: Unknown project id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: Chat projects are not exportable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/projects/import-preview:
    post:
      summary: Upload a .valuzpack project and stage it for import (preview)
      operationId: importProjectPreview
      tags: [projects]
      description: |
        Parse + stage an uploaded .valuzpack carrying a `project` target.
        Returns a preview of what it
        contains (project meta, members with library state, automations,
        project skills, project connectors, shared skill/connector indexes)
        plus a preview_id to confirm with. Reports a name_conflict flag when a
        same-named project already exists for the caller. An agent collection
        pack uploaded here is rejected (400).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: {type: string, format: binary}
      responses:
        "200":
          description: Import preview
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportProjectPreviewResponse"
        "400":
          description: Malformed or oversized archive
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/projects/import/confirm:
    post:
      summary: Commit a staged .valuzpack project import
      operationId: confirmProjectImport
      tags: [projects]
      description: |
        Install the staged project pack's skills, register its connectors,
        recreate its library agents de-duped by slug (runtime/model/provider
        follow the user's defaults), create the project row (fresh id, managed
        cwd), restore the on-disk memory, recreate the team members preserving
        their project-local agent_slug handles, and recreate the automations +
        project skill/connector configs. If a project of the same name already
        exists for the caller, the import is SKIPPED (status=
        "skipped_name_conflict") rather than overwriting it.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportProjectConfirmRequest"
      responses:
        "200":
          description: Import committed (status may be "created" or "skipped_name_conflict")
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ImportProjectConfirmResponse"
        "400":
          description: Preview expired or already used
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: No model channel configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: No model channel configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  # ------------------------------------------------------------------
  # Marketplace — normalized discovery/import catalog over SkillHub,
  # ModelScope MCP, and Valuz-curated agent / agent-team templates.
  # The client never talks to SkillHub directly; this layer normalizes
  # every source into one item shape (see MarketplaceItem).
  # ------------------------------------------------------------------

  /v1/marketplace/categories:
    get:
      summary: List normalized marketplace categories
      operationId: listMarketplaceCategories
      tags: [marketplace]
      description: |
        Category rail data for one marketplace tab. `kind=skill` returns the
        curated SkillHub category allowlist with per-category counts;
        `kind=agent` returns the curated agent/team scenario categories;
        `kind=connector` returns common ModelScope MCP categories. When an
        upstream is unreachable the response degrades to an
        empty list with `degraded: true` instead of failing.
      parameters:
        - in: query
          name: kind
          required: true
          schema: {type: string, enum: [skill, agent, connector]}
      responses:
        "200":
          description: Categories listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceCategoryList"

  /v1/marketplace/items:
    get:
      summary: List normalized marketplace items
      operationId: listMarketplaceItems
      tags: [marketplace]
      description: |
        Paged catalog browse for one item type. Skill queries push category /
        search filters down to SkillHub (curated category allowlist only —
        Valuz-official skills ship with the client and are never market
        items); agent / team queries serve Valuz-curated templates; connector
        queries read ModelScope in real time, preserve its default order, and
        request hosted entries in pages through the first 100 results.
        `degraded: true` marks an upstream outage.
      parameters:
        - in: query
          name: type
          required: true
          schema: {type: string, enum: [skill, agent_template, agent_team_template, connector]}
        - in: query
          name: category
          required: false
          schema: {type: string}
        - in: query
          name: subcategory
          required: false
          schema: {type: string}
        - in: query
          name: source
          required: false
          schema: {type: string, enum: [skillhub, valuz_official, modelscope]}
        - in: query
          name: q
          required: false
          schema: {type: string}
        - in: query
          name: page
          required: false
          schema: {type: integer, minimum: 1, default: 1}
        - in: query
          name: page_size
          required: false
          schema: {type: integer, minimum: 1, maximum: 100, default: 30}
      responses:
        "200":
          description: Items listed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceItemList"

  /v1/marketplace/items/{item_id}:
    get:
      summary: Get one marketplace item with import-preview detail
      operationId: getMarketplaceItem
      tags: [marketplace]
      description: |
        Full import-preview payload. Skills add owner / version / security
        report / pre-install file list; agent templates add instructions,
        bound skills and connector requirements; team templates add the
        member roster. Item ids are stable `{source}:{type}:{ref}` strings.
      parameters:
        - in: path
          name: item_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Item detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceItemDetail"
        "404":
          description: Unknown item id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: SkillHub upstream unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/marketplace/items/{item_id}:install:
    post:
      summary: Install a marketplace item into the caller's library
      operationId: installMarketplaceItem
      tags: [marketplace]
      description: |
        Confirmed install. SkillHub skills download through the existing
        skill URL-import pipeline (size/count caps + provenance recorded);
        agent templates create a library agent (runtime/model/provider/effort
        follow the user's global defaults); team templates import the
        built-in pack (idempotent by role slug). Installs are idempotent —
        re-installing reports `already_installed`.
      parameters:
        - in: path
          name: item_id
          required: true
          schema: {type: string}
      responses:
        "200":
          description: Installed (or already present)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MarketplaceInstallResult"
        "404":
          description: Unknown item id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: No model channel configured (agent/team installs)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "502":
          description: SkillHub upstream unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /v1/notifications:
    get:
      summary: Open notifications + unread count (the unified attention ledger)
      description: |
        The single, backend-reconciled account of "things needing the user" —
        questions (kind=question) and task failures (kind=task_failed) alike.
        Supersedes /v1/decisions/* and the interim /v1/tasks/attention.
      operationId: listNotifications
      tags: [notifications]
      responses:
        "200":
          description: Open notifications
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListResponse"
  /v1/notifications/stream:
    get:
      summary: SSE stream of notification changes (snapshot/added/updated/resolved)
      operationId: streamNotifications
      tags: [notifications]
      responses:
        "200":
          description: SSE stream
  /v1/notifications:read-all:
    post:
      summary: Mark all of the caller's notifications read
      operationId: markAllNotificationsRead
      tags: [notifications]
      responses:
        "200":
          description: OK
  /v1/notifications/{notification_id}:read:
    post:
      summary: Mark one notification read
      operationId: markNotificationRead
      tags: [notifications]
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: OK
  /v1/notifications/{notification_id}:dismiss:
    post:
      summary: Dismiss (resolve) one notification
      operationId: dismissNotification
      tags: [notifications]
      parameters:
        - name: notification_id
          in: path
          required: true
          schema: {type: string}
      responses:
        "200":
          description: OK

components:
  schemas:
    FileCapabilities:
      type: object
      required: [canPreview, canDownload, canOpenExternal, canCopyContent]
      properties:
        canPreview: {type: boolean}
        canDownload: {type: boolean}
        canOpenExternal: {type: boolean}
        canCopyContent: {type: boolean}
    ResolveFilesRequest:
      type: object
      required: [refs]
      properties:
        refs:
          type: array
          maxItems: 256
          items: {type: string}
    ResolvedFileDescriptor:
      type: object
      required: [ref, kind, name, exists, previewKind, capabilities]
      properties:
        ref: {type: string}
        kind: {type: string, enum: [local, remote, ""]}
        absPath: {type: string, nullable: true}
        url: {type: string, nullable: true}
        expiresAt: {type: integer, nullable: true}
        name: {type: string}
        mimeType: {type: string, nullable: true}
        size: {type: integer, nullable: true}
        exists: {type: boolean}
        previewKind:
          type: string
          enum: [markdown, code, image, pdf, html, docx, media, spreadsheet, plain, unsupported]
        capabilities:
          $ref: "#/components/schemas/FileCapabilities"
        error:
          type: string
          enum: [invalid_ref, forbidden, not_found]
          nullable: true
    ResolveFilesResponse:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/ResolvedFileDescriptor"
    BrowserStatus:
      type: object
      required: [daemon_running, mode, node_ok, cli_prefix, hints]
      properties:
        daemon_running: {type: boolean}
        mode: {type: string, enum: [managed, attach]}
        node_ok: {type: boolean}
        cli_prefix: {type: string}
        pid: {type: integer, nullable: true}
        hints:
          type: array
          items: {type: string}
    BrowserStartResult:
      type: object
      required: [status, mode, cli_prefix]
      properties:
        status: {type: string}
        mode: {type: string}
        cli_prefix: {type: string}
    BrowserStopResult:
      type: object
      required: [status]
      properties:
        status: {type: string}
    MemoryTarget:
      type: string
      enum: [user, global, project]
    MemoryView:
      type: object
      required: [enabled, auto_extract, custom_instructions, entries]
      properties:
        enabled: {type: boolean}
        auto_extract: {type: boolean}
        custom_instructions:
          type: string
          description: >-
            User-authored guidance appended to the background reviewer prompt
            (global). Steers what the auto-extractor saves/skips and takes
            precedence over the default soft heuristics; empty disables it.
            Hard rules (secret redaction, knowledge-base dedup, output contract)
            are not overridable.
        entries:
          type: object
          additionalProperties:
            type: array
            items: {type: string}
          description: Entries per scope, keyed by target (user / global / project).
    MemorySettings:
      type: object
      required: [enabled, auto_extract, custom_instructions]
      properties:
        enabled: {type: boolean}
        auto_extract: {type: boolean}
        custom_instructions: {type: string}
    MemorySettingsPatch:
      type: object
      properties:
        enabled: {type: boolean}
        auto_extract: {type: boolean}
        custom_instructions:
          type: string
          description: Global reviewer guidance; capped server-side (1500 chars).
    MemoryEntryDelete:
      type: object
      required: [target, old_text]
      properties:
        target: {$ref: "#/components/schemas/MemoryTarget"}
        old_text: {type: string}
        project_id: {type: string}
    MemoryClear:
      type: object
      required: [target]
      properties:
        target: {$ref: "#/components/schemas/MemoryTarget"}
        project_id: {type: string}
    ActivityItem:
      type: object
      required: [kind, id, title, status, is_automation, project_id, sort_at]
      properties:
        kind: {type: string, enum: [chat, task]}
        id: {type: string, description: "session id for chats, task id for tasks."}
        title: {type: string}
        status: {type: string, description: "session status for chats, task status for tasks."}
        is_automation: {type: boolean}
        project_id: {type: string}
        project_name: {type: string, nullable: true, description: "null for non-project quick chats."}
        sort_at: {type: integer, format: int64, description: "Unix epoch ms; interleave key + cursor."}
    ActivityPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"
        next_cursor:
          type: string
          nullable: true
          description: "Keyset cursor for the next page; null when exhausted."
    RunSummary:
      type: object
      required: [session_id, source_kind, project_id, title, status, updated_at]
      properties:
        session_id: {type: string}
        source_kind:
          type: string
          enum: [assistant, project_chat, task]
        project_id: {type: string}
        project_name: {type: string, nullable: true}
        task_id: {type: string, nullable: true}
        origin:
          type: string
          description: "user | automation | task — who created the session."
        title: {type: string}
        status: {type: string}
        current_todo:
          type: object
          nullable: true
          required: [content, status]
          properties:
            content: {type: string}
            status: {type: string}
            activeForm: {type: string, nullable: true}
        last_message: {type: string, nullable: true}
        last_output: {type: string, nullable: true}
        last_event:
          type: object
          nullable: true
          description: Tasks only — latest timeline event ({type, payload}).
          required: [type, payload]
          properties:
            type: {type: string}
            payload: {type: object, additionalProperties: true}
        model: {type: string, nullable: true}
        runtime: {type: string, nullable: true}
        updated_at: {type: integer, format: int64, description: "Unix epoch milliseconds (UTC). Format via new Date(ms)."}
        background:
          type: boolean
          default: false
          description: >-
            True when the session carries a live background task
            (run_in_background shell command). Such sessions surface in the
            status=running view even while no turn is streaming, so the
            sidebar/Activity keep signalling in-flight work after the user
            navigates away.
    AgentTemplateRole:
      type: object
      required: [slug, name, description, instructions, avatar, skills, connector_types, runtime, in_library]
      properties:
        slug: {type: string, description: "Fixed slug used for idempotent de-dup."}
        name: {type: string}
        description: {type: string}
        instructions: {type: string}
        avatar: {type: string}
        skills:
          type: array
          items: {type: string}
        connector_types:
          type: array
          items: {type: string}
        runtime:
          type: string
          description: >-
            The role's recommended runtime (claude_agent / codex), shown as a
            badge on the detail page. Display metadata — added agents follow the
            user's default channel; this surfaces the design (e.g. the World Cup
            team's dual-runtime split).
        effort:
          type: string
          nullable: true
          enum: [low, medium, high, xhigh, max]
          description: "The role's recommended reasoning-effort budget (display badge)."
        in_library:
          type: boolean
          description: "True if an agent with this slug already exists in the caller's library."
    AgentTemplate:
      type: object
      required: [id, scenario, name, description, icon, roles, added]
      properties:
        id: {type: string}
        scenario: {type: string, description: "Grouping label for the templates panel, e.g. 投研 / 内容创作."}
        name: {type: string}
        description: {type: string}
        icon: {type: string, description: "Avatar preset key rendered on the team card."}
        added:
          type: boolean
          description: "True when every role is already in the caller's library (card shows 已添加, disabled)."
        roles:
          type: array
          items: {$ref: "#/components/schemas/AgentTemplateRole"}
    AgentTemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items: {$ref: "#/components/schemas/AgentTemplate"}
    AddAgentTemplateResponse:
      type: object
      required: [template_id, created, skipped, roles]
      properties:
        template_id: {type: string}
        created: {type: integer, description: "Number of roles newly created this call."}
        skipped: {type: integer, description: "Number of roles already present (skipped)."}
        roles:
          type: array
          description: "All of the template's role agents — newly created and pre-existing."
          items: {$ref: "#/components/schemas/Agent"}
    MarketplaceBadge:
      type: string
      description: "Trust / cost / setup flag rendered as a card or modal badge."
      enum:
        - free_install
        - requires_api_key
        - third_party_cost
        - reviewed_skillhub
        - reviewed_valuz
        - community
        - verified
        - locked
    MarketplaceStats:
      type: object
      properties:
        downloads: {type: integer, nullable: true}
        stars: {type: integer, nullable: true}
        installs: {type: integer, nullable: true}
        views: {type: integer, nullable: true}
    MarketplaceTeamMember:
      type: object
      required: [name, role, lead]
      properties:
        slug: {type: string, nullable: true}
        name: {type: string}
        role: {type: string, description: "One-line responsibility."}
        lead: {type: boolean}
        skill_count: {type: integer, nullable: true}
    MarketplaceConnectorRequirement:
      type: object
      required: [name, requirement]
      properties:
        name: {type: string}
        requirement:
          type: string
          enum: [required, optional, api_key, cost]
    MarketplaceConnectorConfigField:
      type: object
      required: [key, name, target, label, required, secret]
      properties:
        key: {type: string}
        name: {type: string, description: "Actual environment/header/query parameter name."}
        target: {type: string, enum: [env, header, param]}
        label: {type: string}
        required: {type: boolean}
        secret: {type: boolean}
        placeholder: {type: string, nullable: true}
        prefix: {type: string, nullable: true}
    MarketplaceConnectorConfig:
      type: object
      required: [slug, transport, args, env, headers, params, auth_type, fields, supported]
      properties:
        slug: {type: string}
        transport: {type: string, enum: [stdio, http, sse]}
        url: {type: string, nullable: true}
        command: {type: string, nullable: true}
        args:
          type: array
          items: {type: string}
        env:
          type: object
          additionalProperties: {type: string}
        headers:
          type: object
          additionalProperties: {type: string}
        params:
          type: object
          additionalProperties: {type: string}
        auth_type: {type: string, enum: [none, bearer, oauth]}
        fields:
          type: array
          items: {$ref: "#/components/schemas/MarketplaceConnectorConfigField"}
        supported: {type: boolean}
        unsupported_reason: {type: string, nullable: true}
    MarketplaceFileEntry:
      type: object
      required: [path]
      properties:
        path: {type: string}
        size: {type: integer, nullable: true, description: "Bytes; null when unknown."}
        sha256: {type: string, nullable: true}
    MarketplaceSecurityReport:
      type: object
      required: [status, summary]
      properties:
        status:
          type: string
          enum: [benign, unknown, flagged]
        summary: {type: string}
        reports:
          type: array
          items:
            type: object
            required: [provider, status]
            properties:
              provider: {type: string}
              status: {type: string}
              url: {type: string, nullable: true}
    MarketplaceEvaluationDimension:
      type: object
      required: [key, code, label]
      properties:
        key:
          type: string
          enum: [trust, reliability, adaptability, convention, effectiveness]
        code:
          type: string
          enum: [T, R, A, C, E]
        label: {type: string}
        score: {type: number, nullable: true, description: "TRACE dimension score on a 1-5 scale."}
        summary: {type: string, nullable: true}
    MarketplaceEvaluationReport:
      type: object
      required: [system, dimensions]
      properties:
        system:
          type: string
          enum: [TRACE]
        score: {type: number, nullable: true, description: "Average TRACE score on a 1-5 scale."}
        rating: {type: string, nullable: true, description: "Localized rating derived from the TRACE score."}
        summary: {type: string, nullable: true}
        dimensions:
          type: array
          items: {$ref: "#/components/schemas/MarketplaceEvaluationDimension"}
    MarketplaceItem:
      type: object
      description: |
        The normalized card shape shared by every marketplace source. `id` is
        a stable `{source}:{type}:{ref}` string (e.g. `skillhub:skill:agent-memory`,
        `valuz:agent:meeting-notes`, `valuz:team:investment`).
      required: [id, type, source, source_ref, title, description, badges, install_target, installed]
      properties:
        id: {type: string}
        type:
          type: string
          enum: [skill, agent_template, agent_team_template, connector]
        source:
          type: string
          enum: [skillhub, valuz_official, modelscope]
        source_ref: {type: string, description: "SkillHub slug / template id / pack id."}
        title: {type: string}
        subtitle: {type: string, nullable: true, description: "Agent role line; null for skills."}
        description: {type: string}
        icon: {type: string, nullable: true, description: "Icon URL (SkillHub) or named icon (curated)."}
        category: {type: string, nullable: true}
        category_label: {type: string, nullable: true}
        subcategories:
          type: array
          items: {type: string}
        badges:
          type: array
          items: {$ref: "#/components/schemas/MarketplaceBadge"}
        stats:
          $ref: "#/components/schemas/MarketplaceStats"
        version: {type: string, nullable: true}
        runtime: {type: string, nullable: true, description: "Agent templates only."}
        skill_count: {type: integer, nullable: true}
        members:
          type: array
          nullable: true
          description: "Team templates only — brief roster for card avatars."
          items: {$ref: "#/components/schemas/MarketplaceTeamMember"}
        install_target:
          type: string
          enum: [skill_library, agent_library, agent_library_project, connector_library]
        installed: {type: boolean}
        locked: {type: boolean, default: false, description: "Present but not installable (e.g. official skill requires Reportify)."}
    MarketplaceItemDetail:
      allOf:
        - $ref: "#/components/schemas/MarketplaceItem"
        - type: object
          properties:
            owner: {type: string, nullable: true}
            origin_url: {type: string, nullable: true, description: "Human-facing upstream page."}
            updated_at: {type: string, nullable: true, description: "ISO date of the last upstream update."}
            instructions: {type: string, nullable: true, description: "Agent templates — role/instructions summary."}
            workflow:
              type: array
              nullable: true
              description: "Agent Teams — ordered collaboration steps shown in the import preview."
              items: {type: string}
            deliverables:
              type: array
              nullable: true
              description: "Agent Teams — concrete outputs the user receives."
              items: {type: string}
            usage_notes:
              type: array
              nullable: true
              description: "Agent Teams — setup, safety, or scope notes for the preview."
              items: {type: string}
            bound_skills:
              type: array
              nullable: true
              items: {type: string}
            connectors:
              type: array
              nullable: true
              items: {$ref: "#/components/schemas/MarketplaceConnectorRequirement"}
            files:
              type: array
              nullable: true
              description: "Skills — pre-install file preview."
              items: {$ref: "#/components/schemas/MarketplaceFileEntry"}
            security:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/MarketplaceSecurityReport"
            evaluation:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/MarketplaceEvaluationReport"
            connector_config:
              nullable: true
              allOf:
                - $ref: "#/components/schemas/MarketplaceConnectorConfig"
            install_manifest:
              type: object
              nullable: true
              description: |
                Opaque, type-varies-by-`type` install payload from the market
                index: skill -> {download_url, sha256?, size_bytes?};
                agent_template -> an AgentTemplateDef-shaped object;
                agent_team_template -> a pack manifest object (skill deps
                rewritten to {slug, source: "url", download_url}). Only the
                market index sets this field.
    MarketplaceItemList:
      type: object
      required: [items, total, page, page_size, degraded]
      properties:
        items:
          type: array
          items: {$ref: "#/components/schemas/MarketplaceItem"}
        total: {type: integer}
        page: {type: integer}
        page_size: {type: integer}
        degraded: {type: boolean, description: "True when SkillHub was unreachable and results are official-only."}
    MarketplaceCategory:
      type: object
      required: [key, label]
      properties:
        key: {type: string}
        label: {type: string}
        count: {type: integer, nullable: true}
        subcategories:
          type: array
          items:
            type: object
            required: [key, label]
            properties:
              key: {type: string}
              label: {type: string}
    MarketplaceCategoryList:
      type: object
      required: [categories, degraded]
      properties:
        categories:
          type: array
          items: {$ref: "#/components/schemas/MarketplaceCategory"}
        degraded: {type: boolean}
    MarketplaceInstallResult:
      type: object
      required: [item_id, status]
      properties:
        item_id: {type: string}
        status:
          type: string
          enum: [installed, already_installed]
        installed_ref: {type: string, nullable: true, description: "Resulting library slug (skill or agent) or pack id."}
        created: {type: integer, nullable: true, description: "Team installs — roles newly created."}
        skipped: {type: integer, nullable: true, description: "Team installs — roles already present."}
    ExportCollection:
      type: object
      description: "Optional display header to brand the exported group."
      properties:
        name: {type: string, nullable: true}
        description: {type: string, nullable: true}
        scenario: {type: string, nullable: true}
        icon: {type: string, nullable: true}
    ExportPackRequest:
      type: object
      required: [agent_slugs]
      properties:
        agent_slugs:
          type: array
          items: {type: string}
          description: "Library agent slugs to export (1..N)."
        collection:
          $ref: "#/components/schemas/ExportCollection"
    ImportPreviewCollection:
      type: object
      required: [id, name, description, scenario, icon]
      properties:
        id: {type: string}
        name: {type: string}
        description: {type: string}
        scenario: {type: string}
        icon: {type: string}
    ImportPreviewAgent:
      type: object
      required: [slug, name, description, in_library]
      properties:
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        in_library: {type: boolean, description: "Already present in the user's library."}
    ImportPreviewSkill:
      type: object
      required: [slug, source]
      properties:
        slug: {type: string}
        source: {type: string, enum: [embedded, bundled]}
    ImportPreviewConnector:
      type: object
      required: [slug, display_name, requires_credentials, requires_setup, already_present]
      properties:
        slug: {type: string}
        display_name: {type: string}
        requires_credentials: {type: boolean}
        requires_setup: {type: boolean}
        already_present: {type: boolean}
    ImportPackPreviewResponse:
      type: object
      required: [preview_id, agents, skills, connectors]
      properties:
        preview_id: {type: string}
        collection:
          allOf: [{$ref: "#/components/schemas/ImportPreviewCollection"}]
          nullable: true
        agents:
          type: array
          items: {$ref: "#/components/schemas/ImportPreviewAgent"}
        skills:
          type: array
          items: {$ref: "#/components/schemas/ImportPreviewSkill"}
        connectors:
          type: array
          items: {$ref: "#/components/schemas/ImportPreviewConnector"}
    ImportPackConfirmRequest:
      type: object
      required: [preview_id]
      properties:
        preview_id: {type: string}
    ConnectorToConfigure:
      type: object
      required: [slug, display_name, requires_credentials, requires_setup]
      properties:
        slug: {type: string}
        display_name: {type: string}
        requires_credentials: {type: boolean}
        requires_setup: {type: boolean}
    ImportPackConfirmResponse:
      type: object
      required: [created, skipped, roles, connectors_to_configure]
      properties:
        created: {type: integer}
        skipped: {type: integer}
        roles:
          type: array
          items: {$ref: "#/components/schemas/Agent"}
        connectors_to_configure:
          type: array
          items: {$ref: "#/components/schemas/ConnectorToConfigure"}
    ImportProjectPreviewMember:
      type: object
      required: [agent_slug, source_agent_slug, name, description, in_library]
      properties:
        agent_slug: {type: string, description: "Project-local member handle the recipient preserves."}
        source_agent_slug: {type: string, description: "Library slug the snapshot represents (de-dup key)."}
        name: {type: string}
        description: {type: string}
        in_library: {type: boolean, description: "Whether a library agent of that slug already exists."}
    ImportProjectPreviewAutomation:
      type: object
      required: [name, agent_slug, trigger_kind, cron_expr, interval_seconds, status]
      properties:
        name: {type: string}
        agent_slug: {type: string}
        trigger_kind: {type: string, enum: [cron, interval, manual]}
        cron_expr: {type: string, nullable: true}
        interval_seconds: {type: integer, nullable: true}
        status: {type: string}
    ImportProjectConfirmRequest:
      type: object
      required: [preview_id]
      properties:
        preview_id: {type: string}
    ImportProjectPreviewResponse:
      type: object
      required: [preview_id, project, name_conflict, members, automations, project_skills, project_connectors, skills, connectors, has_memory]
      properties:
        preview_id: {type: string}
        project:
          type: object
          required: [name, kind, icon, instructions_md]
          properties:
            name: {type: string}
            kind: {type: string}
            icon: {type: string, nullable: true}
            instructions_md: {type: string}
        name_conflict:
          type: boolean
          description: "True when a same-named project already exists for the caller — confirm will skip."
        members:
          type: array
          items: {$ref: "#/components/schemas/ImportProjectPreviewMember"}
        automations:
          type: array
          items: {$ref: "#/components/schemas/ImportProjectPreviewAutomation"}
        project_skills:
          type: array
          items: {type: string}
        project_connectors:
          type: array
          items: {type: string}
        skills:
          type: array
          items: {$ref: "#/components/schemas/ImportPreviewSkill"}
        connectors:
          type: array
          items: {$ref: "#/components/schemas/ImportPreviewConnector"}
        has_memory: {type: boolean}
    ImportProjectConfirmResponse:
      type: object
      required: [status, project, members_created, members_reused, agents_created, agents_skipped, automations_created, automation_errors, connectors_to_configure]
      properties:
        status:
          type: string
          enum: [created, skipped_name_conflict]
          description: "\"created\" — the project was created; \"skipped_name_conflict\" — a same-named project existed, so nothing was written."
        project:
          type: object
          nullable: true
          description: "The created project as a ProjectListItem (id/name/kind/root_path/icon/cwd). Null on skip."
          properties:
            id: {type: string}
            name: {type: string}
            kind: {type: string}
            root_path: {type: string, nullable: true}
            icon: {type: string, nullable: true}
            cwd: {type: string, nullable: true}
        project_id: {type: string, nullable: true}
        project_name: {type: string, nullable: true}
        members_created: {type: integer, description: "Member rows created in the new project."}
        members_reused: {type: integer, description: "Always 0 — members are always fresh in a new project (reuse applies to library agents, tracked in agents_skipped)."}
        agents_created: {type: integer, description: "Library agents newly created (de-duped by slug)."}
        agents_skipped: {type: integer, description: "Library agents reused (slug already present)."}
        automations_created: {type: integer}
        automation_errors:
          type: array
          description: "Per-automation failures (one bad automation does not sink the rest). Empty when all recreated."
          items:
            type: object
            properties:
              name: {type: string}
              error: {type: string}
        members:
          type: array
          items:
            type: object
            properties:
              agent_slug: {type: string}
              source_agent_slug: {type: string}
        automations:
          type: array
          items:
            type: object
            properties:
              automation_id: {type: string}
              name: {type: string}
        connectors_to_configure:
          type: array
          items: {$ref: "#/components/schemas/ConnectorToConfigure"}
    Agent:
      type: object
      required: [id, slug, name, description, instructions, runtime, model, skills, connector_types, source]
      properties:
        id: {type: string}
        slug: {type: string}
        name: {type: string}
        description: {type: string}
        instructions: {type: string}
        runtime: {type: string}
        model: {type: string}
        skills:
          type: array
          items: {type: string}
        connector_types:
          type: array
          items: {type: string}
        provider_id:
          type: string
          nullable: true
          description: >-
            Default model provider id for instances ((provider, model) pair).
            null for seeded/official agents (provider ids are install-local).
        effort:
          type: string
          nullable: true
          enum: [low, medium, high, xhigh, max]
          description: >-
            Default reasoning-effort budget prefilled into instances. null =
            no override (runtime SDK default). Project conversations read the
            budget from the bound agent.
        source: {type: string}
        readonly: {type: boolean, default: false, description: "If true, the agent cannot be edited."}
        deletable: {type: boolean, default: true, description: "If false, the agent cannot be deleted."}
        avatar:
          type: string
          nullable: true
          description: >-
            Preset icon key or uploaded asset URL for the agent's avatar.
            v1 supports preset keys only. null = no avatar set.
    CreateAgentRequest:
      type: object
      required: [name]
      properties:
        # Optional — backend derives a CJK-preserving, globally-unique slug
        # from ``name`` when omitted (VALUZ-AGENT-SLUG). UI sends name only.
        slug: {type: string, nullable: true}
        name: {type: string}
        description: {type: string, default: ""}
        instructions: {type: string, default: ""}
        runtime: {type: string, default: claude_agent, enum: [claude_agent, codex, deepagents]}
        model: {type: string, default: claude-sonnet-4-6}
        skills:
          type: array
          items: {type: string}
        connector_types:
          type: array
          items: {type: string}
        provider_id: {type: string, nullable: true}
        effort: {type: string, nullable: true, enum: [low, medium, high, xhigh, max]}
        avatar: {type: string, nullable: true}
    UpdateAgentRequest:
      type: object
      properties:
        name: {type: string, nullable: true}
        description: {type: string, nullable: true}
        instructions: {type: string, nullable: true}
        runtime: {type: string, nullable: true, enum: [claude_agent, codex, deepagents]}
        model: {type: string, nullable: true}
        skills:
          type: array
          nullable: true
          items: {type: string}
        connector_types:
          type: array
          nullable: true
          items: {type: string}
        provider_id: {type: string, nullable: true}
        effort: {type: string, nullable: true, enum: [low, medium, high, xhigh, max]}
        avatar: {type: string, nullable: true}
    ConnectorBindingInput:
      type: object
      required: [type]
      properties:
        type: {type: string}
        account_id: {type: string, nullable: true}
    CreateBlankAgentRequest:
      type: object
      required: [name]
      properties:
        # Optional — backend derives from ``name``, unique within the
        # project, when omitted (VALUZ-AGENT-SLUG).
        agent_slug: {type: string, nullable: true}
        name: {type: string}
        instructions: {type: string, default: ""}
        runtime: {type: string, default: claude_agent, enum: [claude_agent, codex, deepagents]}
        model: {type: string, default: claude-sonnet-4-6}
        provider_id: {type: string, nullable: true}
        effort: {type: string, nullable: true, enum: [low, medium, high, xhigh, max]}
        skills:
          type: array
          nullable: true
          items: {type: string}
        connector_bindings:
          type: array
          nullable: true
          items:
            $ref: "#/components/schemas/ConnectorBindingInput"
    DeployAgentRequest:
      type: object
      required: [source_agent_slug]
      description: >-
        v2 派驻 (live reference). Config lives on the agent, so there is no
        per-deploy provider/model/connector override — just the source agent and
        an optional project-local handle.
      properties:
        source_agent_slug: {type: string}
        # Optional — backend derives from the source agent's name, unique
        # within the target project, when omitted (VALUZ-AGENT-SLUG).
        agent_slug: {type: string, nullable: true}
    ProjectMember:
      type: object
      required: [id, project_id, agent_slug]
      properties:
        id: {type: string}
        project_id: {type: string}
        agent_slug: {type: string}
        source_agent_slug: {type: string, nullable: true}
    AgentSummary:
      type: object
      required: [id, name, model, runtime_provider, instructions, skills, connectors]
      properties:
        id: {type: string}
        name: {type: string}
        model: {type: string}
        runtime_provider: {type: string}
        instructions: {type: string}
        skills:
          type: array
          items: {type: string}
        connectors:
          type: array
          items: {type: string}
        provider_id: {type: string, nullable: true}
        effort: {type: string, nullable: true, enum: [low, medium, high, xhigh, max]}
    MemberWithAgent:
      type: object
      required: [member, agent]
      properties:
        member:
          $ref: "#/components/schemas/ProjectMember"
        agent:
          oneOf:
            - $ref: "#/components/schemas/AgentSummary"
            - type: "null"
    ProposeAgentConfirmRequest:
      type: object
      description: >-
        Spec of an agent the user is confirming. Mirrors the ``propose_agent``
        tool input; the backend derives a unique slug from ``name``.
      required: [name, instructions]
      properties:
        name: {type: string}
        instructions: {type: string}
        description: {type: string, default: ""}
        runtime: {type: string, default: claude_agent, enum: [claude_agent, codex, deepagents]}
        model: {type: string, default: claude-sonnet-4-6}
        effort: {type: string, nullable: true, enum: [low, medium, high, xhigh, max]}
        skills:
          type: array
          items: {type: string}
        connectors:
          type: array
          items: {type: string}
        avatar: {type: string, nullable: true}
    ProposeAgentConfirmResponse:
      type: object
      required: [agent, deployed]
      properties:
        agent:
          $ref: "#/components/schemas/AgentSummary"
        member:
          oneOf:
            - $ref: "#/components/schemas/ProjectMember"
            - type: "null"
        deployed: {type: boolean}
        project_id: {type: string, nullable: true}
    KickoffTaskRequest:
      type: object
      required: [goal, lead_agent_slug]
      properties:
        goal: {type: string}
        lead_agent_slug: {type: string}
        refs:
          type: array
          nullable: true
          items: {type: string}
        title: {type: string, nullable: true}
        created_by: {type: string, default: user}
        dispatch_mode:
          type: string
          enum: [sync, async]
          default: async
          description: >-
            Dispatch architecture (M10). Both share one lead toolset
            (non-blocking dispatch + await_members + plan/review/finish) and
            goal mode; they differ only in the session driver. "async"
            (default) runs the lead as a persistent actor re-woken by
            member_done/send until finish_task (robust for multi-turn / long
            members); "sync" (legacy) drives the lead in a single turn then
            finalizes, with no re-drive.
        worktree:
          type: boolean
          default: false
          description: >-
            Task-level worktree isolation (docs/design/project-worktree-design.md
            §5). The whole task — lead and every dispatched member — runs in
            ONE git worktree of the project repo (branch valuz/task-<id>); no
            per-member isolation on top. When the task finishes, a clean
            worktree is removed automatically; one with work left surfaces in
            the project's worktrees panel. Requires the project cwd to be
            inside a git repository (422 otherwise).
    Task:
      type: object
      required: [id, project_id, title, goal, status, created_by, lead_agent_slug, current_holder, file_path, created_at, updated_at]
      properties:
        id: {type: string}
        project_id: {type: string}
        title: {type: string}
        goal: {type: string}
        status: {type: string}
        created_by: {type: string}
        lead_agent_slug: {type: string}
        current_holder: {type: string}
        file_path: {type: string}
        created_at: {type: integer, format: int64, description: "Unix epoch milliseconds (UTC). Format via new Date(ms)."}
        updated_at: {type: integer, format: int64, description: "Unix epoch milliseconds (UTC). Format via new Date(ms)."}
        trigger:
          allOf: [{$ref: "#/components/schemas/TaskTrigger"}]
          nullable: true
          description: "Resolved provenance — who/what spawned this task (drives the task-list '由 … 触发' line)."
    TaskTrigger:
      type: object
      required: [type]
      description: "Who/what spawned a task. The source_* ids deep-link to the parent task / automation / conversation."
      properties:
        type: {type: string, enum: [user, chat, agent, automation], description: "user = direct action; chat = a project conversation; agent = another task's lead/member; automation = a scheduled/agent-run automation."}
        source_task_id: {type: string, nullable: true, description: "Parent task (type=agent)."}
        source_task_title: {type: string, nullable: true}
        source_agent_slug: {type: string, nullable: true, description: "Triggering agent (type=agent)."}
        source_automation_id: {type: string, nullable: true, description: "Automation that fired it (type=automation)."}
        source_automation_name: {type: string, nullable: true}
        source_session_id: {type: string, nullable: true, description: "Originating conversation (type=chat)."}
    TaskRun:
      type: object
      required: [id, session_id, agent_slug, sequence, kind, status, project_mode]
      properties:
        id: {type: string}
        session_id: {type: string}
        agent_slug: {type: string}
        sequence: {type: integer}
        kind: {type: string}
        status: {type: string}
        label: {type: string, nullable: true}
        goal: {type: string, nullable: true}
        dispatched_by: {type: string, nullable: true}
        project_mode: {type: string}
        run_dir: {type: string, nullable: true}
        result_manifest:
          type: object
          nullable: true
          additionalProperties: true
    TaskEvent:
      type: object
      required: [id, sequence, type, actor, payload, created_at]
      properties:
        id: {type: string}
        sequence: {type: integer}
        type: {type: string}
        actor: {type: string}
        session_id: {type: string, nullable: true}
        payload:
          type: object
          additionalProperties: true
        created_at: {type: integer, format: int64, description: "Unix epoch milliseconds (UTC). Format via new Date(ms)."}
    TaskDetail:
      type: object
      required: [task, runs, events]
      properties:
        task:
          $ref: "#/components/schemas/Task"
        runs:
          type: array
          items:
            $ref: "#/components/schemas/TaskRun"
        events:
          type: array
          items:
            $ref: "#/components/schemas/TaskEvent"
    NotificationEntry:
      type: object
      required: [id, kind, title, body, action, urgency, payload, created_at]
      properties:
        id: {type: string}
        kind: {type: string, description: "question | task_failed | …"}
        title: {type: string}
        body: {type: string}
        route: {type: string, nullable: true}
        action: {type: string, description: "answer | resume | none"}
        urgency: {type: string, description: "actionable | info"}
        task_id: {type: string, nullable: true}
        project_id: {type: string, nullable: true}
        session_id: {type: string, nullable: true}
        pending_id: {type: string, nullable: true}
        payload: {type: object, additionalProperties: true}
        created_at: {type: integer, format: int64}
        read_at: {type: integer, format: int64, nullable: true}
        resolved_at: {type: integer, format: int64, nullable: true}
    NotificationListResponse:
      type: object
      required: [entries, unread]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/NotificationEntry"
        unread: {type: integer}
    InterveneRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [note, revise_goal, pause, resume, stop]
        text: {type: string, nullable: true}
        goal: {type: string, nullable: true}
    ApiResponse:
      type: object
      required: [data]
      properties:
        data: {}
        error:
          $ref: "#/components/schemas/ApiError"
          nullable: true

    ApiError:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string

    PaginatedResponse:
      allOf:
        - $ref: "#/components/schemas/ApiResponse"
        - type: object
          properties:
            meta:
              type: object
              properties:
                page:
                  type: integer
                page_size:
                  type: integer
                total:
                  type: integer

    # ── Document Library schemas ───────────────────────────────────

    DocumentListItem:
